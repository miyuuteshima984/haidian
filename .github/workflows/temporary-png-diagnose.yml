name: temporary-jingzhang-png-diagnose

on:
  push:
    branches:
      - automation/jingzhang-finalize

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose-pngs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout formal submission
        uses: actions/checkout@v4
        with:
          ref: submission/miyuuteshima984/jingzhang-ai-civic-infrastructure
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure/assets/figures/
          persist-credentials: false

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Diagnose all core PNGs
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/png-diagnose.txt
          from pathlib import Path
          from PIL import Image
          import hashlib, struct

          root = Path('submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure/assets/figures')
          for p in sorted(root.glob('*.png')):
              data = p.read_bytes()
              status=[]
              status.append(f'size={len(data)}')
              status.append(f'sha256={hashlib.sha256(data).hexdigest()}')
              status.append(f'signature={data[:8] == b"\\x89PNG\\r\\n\\x1a\\n"}')
              status.append(f'iend={data.endswith(b"IEND\\xaeB`\\x82")}')
              try:
                  with Image.open(p) as im:
                      status.append(f'format={im.format}')
                      status.append(f'dims={im.width}x{im.height}')
                      im.verify()
                  status.append('verify=PASS')
              except Exception as e:
                  status.append(f'verify=FAIL:{type(e).__name__}:{e}')
              try:
                  with Image.open(p) as im:
                      im.load()
                  status.append('load=PASS')
              except Exception as e:
                  status.append(f'load=FAIL:{type(e).__name__}:{e}')
              print(p.name + ' | ' + ' | '.join(status))
          PY

      - name: Post diagnostics to diagnostic PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## PNG binary integrity diagnostic'
            echo
            echo '```text'
            cat /tmp/png-diagnose.txt 2>/dev/null || true
            echo '```'
          } > /tmp/png-comment.md
          gh pr comment 3 --repo miyuuteshima984/haidian --body-file /tmp/png-comment.md
