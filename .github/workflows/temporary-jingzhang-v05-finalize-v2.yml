name: Temporary Jingzhang v0.6 finalize

on:
  push:
    branches:
      - automation/jingzhang-finalize

permissions:
  contents: write

env:
  TARGET_BRANCH: submission/miyuuteshima984/jingzhang-city-completeness-v06
  PKG: submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Sparse checkout v0.6
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            requirements-review.txt
            scripts
            brief
            data
            docs
            skills
            templates
            scenarios
            tracks
            submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure
          persist-credentials: true

      - name: Prepare branch and upstream
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/open-city-ai/haidian.git
          git fetch upstream main --no-tags --filter=blob:none
          git status --short

      - name: Install review and rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-review.txt
          python3 -m pip install pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Integrate v0.6 evidence and manifest entries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          pkg = Path('submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure')

          # Keep taskbook matrices synchronized with the v0.6 evidence now present in the proposal.
          cm_path = pkg / 'compliance_matrix.json'
          cm = json.loads(cm_path.read_text(encoding='utf-8'))
          visual_additions = {
              'agent.1': ['评审证据索引', 'v0.6评审证据总表'],
              'agent.2': ['评审证据索引', 'v0.6评审证据总表'],
              'agent.3': ['三个旗舰试点协议', '包容性与负担矩阵', '评审证据索引', 'v0.6评审证据总表'],
              'agent.4': ['包容性与负担矩阵', '评审证据索引'],
              'agent.5': ['包容性与负担矩阵', '评审证据索引'],
              'agent.6': ['实施资源与RACI证据门', '评审证据索引', 'v0.6评审证据总表'],
          }
          for item in cm.get('requirements', []):
              rid = item.get('requirement_id')
              if rid in visual_additions:
                  values = list(item.get('visual_sections') or [])
                  for value in visual_additions[rid]:
                      if value not in values:
                          values.append(value)
                  item['visual_sections'] = values
          cm_path.write_text(json.dumps(cm, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sm_path = pkg / 'standard_matrix.json'
          sm = json.loads(sm_path.read_text(encoding='utf-8'))
          for item in sm.get('standards', []):
              if item.get('standard_id') == 'PROJECT-AGENT-OPEN-CALL-TASKBOOK':
                  item['evidence_summary_zh'] = (
                      'agent.1-agent.6 已进入 compliance_matrix；v0.5 的任务书协同闭环、六案例、八要素生态、10场景、'
                      '公共空间/品牌/运营/隐私证据继续保留；v0.6 新增三个旗舰试点协议、9类包容性与负担矩阵、'
                      '实施资源与RACI证据门、七维与agent.1-agent.6评审证据索引，并将高价值证据推到离线visual首屏。'
                  )
          sm_path.write_text(json.dumps(sm, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Use timeless final-status wording in the offline visual. The actual persisted self-check remains authoritative.
          replacements = {
              pkg / 'visual/index.html': (
                  '<div class="ok"><b>v0.5 exact head 已通过并合并。</b> PR #2062 的 trusted deterministic / spatial / visual / professional 四道 gate 均 PASS；v0.6 当前仍在设计集成，新增文件尚未完成 manifest refresh 与 persisted self-check，因此这里不提前宣称 v0.6 final PASS。最终状态只以 v0.6 收口后的 canonical checks 为准。</div>',
                  '<div class="ok"><b>状态以机器可读证据为准。</b> 本页不独立签发最终 PASS；请以当前 exact head 的 `manifest.json` 与 persisted `self_check.json` 为准。机器 PASS 只证明提交包结构、哈希与证据一致性，不把 provisional geometry、未核实主体、预算、许可或现场绩效升级为事实。</div>'
              ),
              pkg / 'visual/index.en.html': (
                  '<div class="ok"><b>The v0.5 exact head passed and merged.</b> PR #2062 passed the trusted deterministic, spatial, visual and professional gates. v0.6 is still in design integration; new files have not yet completed manifest refresh and persisted self-check, so this page does not pre-claim a final v0.6 PASS. Final status will follow the canonical v0.6 checks.</div>',
                  '<div class="ok"><b>Status follows machine-readable evidence.</b> This page does not independently certify a final PASS; use `manifest.json` and the persisted `self_check.json` for the current exact head. A machine PASS proves package structure, hashes and evidence consistency only; it does not turn provisional geometry, unverified actors, budgets, permits or field performance into facts.</div>'
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Expected self-check status block not found in {path}')
              path.write_text(text, encoding='utf-8')

          # Add every v0.6 paired SVG to the manifest before the canonical hash refresher runs.
          manifest_path = pkg / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          zero = '0' * 64
          names = [
              'flagship-pilot-protocols.svg',
              'inclusion-burden-matrix.svg',
              'implementation-resource-raci.svg',
              'reviewer-evidence-index.svg',
              'review-evidence-dashboard.svg',
          ]
          existing = {item.get('path') for item in manifest.get('files', [])}
          for name in names:
              zh_path = f'assets/figures/{name}'
              en_name = f'{Path(name).stem}.en{Path(name).suffix}'
              en_path = f'assets/figures/{en_name}'
              if not (pkg / zh_path).is_file() or not (pkg / en_path).is_file():
                  raise SystemExit(f'Missing bilingual v0.6 asset pair: {name}')
              if zh_path not in existing:
                  manifest['files'].append({
                      'path': zh_path,
                      'role': 'proposal_figure',
                      'required': False,
                      'language': 'zh',
                      'sha256': zero,
                  })
                  existing.add(zh_path)
              if en_path not in existing:
                  manifest['files'].append({
                      'path': en_path,
                      'role': 'proposal_figure',
                      'required': False,
                      'language': 'en',
                      'translation_of': zh_path,
                      'sha256': zero,
                  })
                  existing.add(en_path)
          manifest['generated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          claim = manifest.setdefault('validation_claim', {})
          claim['self_checked'] = False
          claim['known_blockers'] = []
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          # Regenerate the human-readable bilingual report from the now-integrated v0.6 proposal.
          python3 scripts/render_proposal_html.py "$PKG"

      - name: Rebuild bilingual A3 and A0 with review evidence first
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pkg = Path('submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure').resolve()
          fig = pkg / 'assets/figures'
          tmp = Path('/tmp/jzv06')
          tmp.mkdir(exist_ok=True)

          items = [
              ('v0.6 评审证据总表', 'v0.6 Review evidence dashboard', 'review-evidence-dashboard.svg'),
              ('总体范围与 C7 方法', 'Site overview and C7 method', 'site-overview.png'),
              ('三个旗舰试点协议', 'Three flagship pilot protocols', 'flagship-pilot-protocols.svg'),
              ('九类人群包容性与负担', 'Nine-persona inclusion and burden', 'inclusion-burden-matrix.svg'),
              ('实施资源与 RACI 证据门', 'Implementation resource and RACI gates', 'implementation-resource-raci.svg'),
              ('七维与 agent 任务证据索引', 'Rubric and agent-task evidence index', 'reviewer-evidence-index.svg'),
              ('任务书协同闭环', 'Taskbook coordination loop', 'taskbook-coordination-loop.svg'),
              ('全球 AI 案例对照', 'Global AI case comparison', 'case-study-comparison.svg'),
              ('AI 全要素生态', 'Full-factor AI ecosystem', 'ai-ecosystem-map.svg'),
              ('10 张 AI+ 场景卡', 'Ten AI scenario cards', 'ai-scenario-cards.svg'),
              ('区域协同验证', 'Regional collaboration validation', 'regional-collaboration-matrix.svg'),
              ('实施与长期运营', 'Implementation and long-term operations', 'implementation-operations-matrix.svg'),
              ('数据流与隐私治理', 'Privacy and data governance', 'privacy-data-governance.svg'),
              ('品牌 / VI 方向', 'Brand / VI direction', 'brand-vi-direction.svg'),
              ('公共空间组件与导视', 'Public-space components and wayfinding', 'public-space-components-wayfinding.svg'),
              ('公共荣誉地标与活动转化', 'Landmarks, events and conversion', 'landmarks-events-conversion.svg'),
              ('概念用地结构', 'Land-use structure', 'land-use-structure.png'),
              ('三处重点区域', 'Three key areas', 'key-areas.png'),
              ('慢行与蓝绿系统', 'Mobility and blue-green system', 'mobility-bluegreen.png'),
              ('指标与证据缺口', 'Metrics and evidence gaps', 'metrics-evidence.png'),
          ]

          def file_for(name, en):
              path = Path(name)
              candidate = path.with_name(f'{path.stem}.en{path.suffix}')
              return candidate if en and (fig / candidate).is_file() else path

          def uri(name, en):
              return (fig / file_for(name, en)).resolve().as_uri()

          a3_pages = [[item] for item in items]
          a0_pages = [items[0:5], items[5:10], items[10:15], items[15:20]]

          def boards(en, size, pages):
              sections = []
              for page_no, page in enumerate(pages, 1):
                  figures = []
                  for zh, english, name in page:
                      label = english if en else zh
                      figures.append(
                          f'<figure><img src="{uri(name, en)}"><figcaption>{label}</figcaption></figure>'
                      )
                  title = 'JING-ZHANG CITY COMPLETENESS · v0.6' if en else '京张城市完整度 · v0.6'
                  footer = (
                      'Concept proposal · provisional geometry is not an official redline · AI remains optional and stoppable'
                      if en else
                      '概念建议 · provisional geometry 不是官方红线 · AI 保持可选、可停、可退出'
                  )
                  sections.append(
                      f'<section><header><b>{title}</b><span>{page_no}/{len(pages)}</span></header>'
                      f'<div class="g n{len(page)}">{"".join(figures)}</div><footer>{footer}</footer></section>'
                  )
              return f'''<!doctype html><html><head><meta charset="utf-8"><style>
              @page{{size:{size} landscape;margin:7mm}}
              *{{box-sizing:border-box}}body{{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#172033}}
              section{{height:calc(100vh - 2mm);break-after:page;display:flex;flex-direction:column;gap:3mm;overflow:hidden}}
              header{{display:flex;justify-content:space-between;border-bottom:1mm solid #245b8f;padding-bottom:2mm;font-size:18pt}}
              .g{{flex:1;display:grid;gap:3mm;min-height:0}}.n1{{grid-template-columns:1fr}}.n5{{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}}
              figure{{margin:0;border:.3mm solid #ccd5e0;display:flex;flex-direction:column;overflow:hidden;min-height:0}}
              img{{width:100%;height:100%;min-height:0;object-fit:contain}}figcaption{{font-size:8pt;font-weight:700;padding:1mm 2mm}}footer{{font-size:7pt;color:#667085}}
              </style></head><body>{''.join(sections)}</body></html>'''

          for en, lang in [(False, 'zh'), (True, 'en')]:
              (tmp / f'a3-{lang}.html').write_text(boards(en, 'A3', a3_pages), encoding='utf-8')
              (tmp / f'a0-{lang}.html').write_text(boards(en, 'A0', a0_pages), encoding='utf-8')
          PY

          for lang in zh en; do
            if [ "$lang" = zh ]; then
              A3="$PKG/drawings/a3-booklet.pdf"
              A0="$PKG/drawings/a0-boards.pdf"
            else
              A3="$PKG/drawings/a3-booklet.en.pdf"
              A0="$PKG/drawings/a0-boards.en.pdf"
            fi
            "$CHROME" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=3000 --print-to-pdf="$A3" "file:///tmp/jzv06/a3-$lang.html"
            "$CHROME" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=3000 --print-to-pdf="$A0" "file:///tmp/jzv06/a0-$lang.html"
          done

      - name: Refresh manifest and persist strict self-check
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/refresh_submission_manifest.py "$PKG"
          python3 scripts/self_check_submission.py "$PKG" --pr-author miyuuteshima984 --mark-self-checked --json | tee /tmp/selfcheck.json

      - name: Validate binary and document integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import xml.etree.ElementTree as ET

          pkg = Path('submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure')
          bad = []
          for path in sorted((pkg / 'assets/figures').glob('*.png')):
              try:
                  with Image.open(path) as image:
                      image.verify()
                  with Image.open(path) as image:
                      image.load()
              except Exception as exc:
                  bad.append(f'{path}: {exc}')
          for path in sorted((pkg / 'assets/figures').glob('*.svg')):
              try:
                  ET.parse(path)
              except Exception as exc:
                  bad.append(f'{path}: {exc}')
          for path in [
              pkg / 'drawings/a3-booklet.pdf',
              pkg / 'drawings/a3-booklet.en.pdf',
              pkg / 'drawings/a0-boards.pdf',
              pkg / 'drawings/a0-boards.en.pdf',
          ]:
              if not path.is_file() or path.stat().st_size < 10000:
                  bad.append(f'{path}: missing/small')
          if bad:
              raise SystemExit('\n'.join(bad))
          PY
          pdfinfo "$PKG/drawings/a3-booklet.pdf" | grep -E 'Pages|Page size|File size'
          pdfinfo "$PKG/drawings/a0-boards.pdf" | grep -E 'Pages|Page size|File size'

      - name: Commit validated v0.6 package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Miyuu Teshima"
          git config user.email "230504675+miyuuteshima984@users.noreply.github.com"
          git add "$PKG"
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No v0.6 finalization changes to commit'; exit 1; }
          git commit -m "v0.6: finalize bilingual review package and validation"

      - name: Participant preflight with push dry-run
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/participant_preflight.py "$PKG" --pr-author miyuuteshima984 --check-push --json | tee /tmp/preflight.json

      - name: Push validated v0.6 branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$TARGET_BRANCH"
          git rev-parse HEAD
