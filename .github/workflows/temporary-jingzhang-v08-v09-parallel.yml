name: Temporary Jingzhang v0.9 rebase and validate

on:
  push:
    branches:
      - automation/jingzhang-finalize
    paths:
      - .github/workflows/temporary-jingzhang-v08-v09-parallel.yml
      - .github/jingzhang_sprint/**

permissions:
  contents: write

env:
  PKG: submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure
  TARGET_BRANCH: submission/miyuuteshima984/jingzhang-city-completeness-v09

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Sparse checkout current v0.9 branch and trusted tooling
        uses: actions/checkout@v4
        with:
          ref: submission/miyuuteshima984/jingzhang-city-completeness-v09
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            requirements-review.txt
            scripts
            brief
            data
            docs
            skills
            templates
            scenarios
            tracks
            submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure
          persist-credentials: true

      - name: Rebase candidate onto latest upstream main
        shell: bash
        run: |
          set -euo pipefail
          OLD_TARGET="$(git rev-parse HEAD)"
          echo "OLD_TARGET=$OLD_TARGET" >> "$GITHUB_ENV"
          git fetch origin automation/jingzhang-finalize --no-tags --depth=1
          mkdir -p /tmp/jingzhang_sprint
          touch /tmp/jingzhang_sprint/__init__.py
          for f in sprint_common.py sprint_v08.py sprint_v09.py sprint_runner.py; do
            git show "origin/automation/jingzhang-finalize:.github/jingzhang_sprint/$f" > "/tmp/jingzhang_sprint/$f"
          done
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/open-city-ai/haidian.git
          git fetch upstream main --no-tags --filter=blob:none
          git checkout -B "$TARGET_BRANCH"
          git reset --hard upstream/main
          echo "old_target=$OLD_TARGET"
          echo "upstream=$(git rev-parse upstream/main)"
          echo "rebased_base=$(git rev-parse HEAD)"

      - name: Install review and rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-review.txt
          python3 -m pip install pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-noto-cjk
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --version

      - name: Rebuild v0.9 on latest main and validate
        shell: bash
        run: |
          set +e
          PYTHONPATH=/tmp python3 /tmp/jingzhang_sprint/sprint_runner.py v0.9 "$PKG" > /tmp/sprint.log 2>&1
          code=$?
          cat /tmp/sprint.log
          if [ "$code" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/sprint.log').read_text(encoding='utf-8',errors='replace')[-5000:]
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error title=V09_REBASE_BUILD_FAILURE::{text}')
          PY
            exit "$code"
          fi
          set -e
          git diff --check

      - name: Commit validated rebased candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Miyuu Teshima"
          git config user.email "230504675+miyuuteshima984@users.noreply.github.com"
          git add "$PKG"
          git status --short
          if git diff --cached --quiet; then
            echo "No v0.9 candidate changes to commit"
            exit 1
          fi
          git commit -m "v0.9: rebase reality-anchored design onto current main"

      - name: Participant preflight with push dry-run
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/participant_preflight.py "$PKG" --pr-author miyuuteshima984 --check-push --json | tee /tmp/preflight-v09.json

      - name: Push new exact head safely
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:"$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$OLD_TARGET"
