        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/participant_preflight.py "$PKG" --pr-author miyuuteshima984 --check-push --json | tee /tmp/preflight.json

      - name: Push validated v0.5 branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$TARGET_BRANCH"
          echo "PUSHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short
