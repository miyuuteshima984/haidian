name: Temporary Jingzhang v0.5 package rebuild

on:
  push:
    branches:
      - automation/jingzhang-finalize
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: submission/miyuuteshima984/jingzhang-city-completeness-v05
  PKG: submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out v0.5 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            requirements-review.txt
            scripts
            brief
            data
            docs
            skills
            templates
            submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure
          persist-credentials: true

      - name: Prepare branch and upstream
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/open-city-ai/haidian.git
          git fetch upstream main --no-tags --filter=blob:none
          git status --short

      - name: Install review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-review.txt
          python3 -m pip install pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Integrate remaining v0.5 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          pkg = Path("submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure")

          zh = (pkg / "proposal.md").read_text(encoding="utf-8")
          en = (pkg / "proposal.en.md").read_text(encoding="utf-8")

          zh_case_anchor = "这些案例不支撑京张的法定边界、高度或强度，只支撑组织与运营方法。[source:CASE-AISG-100E] [source:CASE-SEOUL-AI-HUB] [source:CASE-PUNGGOL]"
          zh_case_insert = "![全球 AI 创新生态案例对照：机制—京张转译—不复制边界](assets/figures/case-study-comparison.svg)"
          if "case-study-comparison.svg" not in zh:
              assert zh_case_anchor in zh
              zh = zh.replace(zh_case_anchor, zh_case_anchor + "\n\n" + zh_case_insert)

          en_case_anchor = "These cases do not support statutory Jing-Zhang boundaries, heights or development intensity; they support organisational and operating choices only. [source:CASE-AISG-100E] [source:CASE-SEOUL-AI-HUB] [source:CASE-PUNGGOL]"
          en_case_insert = "![Global AI innovation ecosystem comparison: mechanism—Jing-Zhang translation—non-copy boundary](assets/figures/case-study-comparison.en.svg)"
          if "case-study-comparison.en.svg" not in en:
              assert en_case_anchor in en
              en = en.replace(en_case_anchor, en_case_anchor + "\n\n" + en_case_insert)

          zh_ops_anchor = "运营层建议每年进行 C7 城市完整度公开走查、开发者开放周、受控机器人测试开放日、社区公共服务评议和京张技术史展。公开的不应只有“新增了什么 AI”，也应包括“哪项普通城市能力仍有缺口、哪些试点被停止或回退”。"
          zh_ops_insert = "![三个公共荣誉节点、年度活动节奏与研究—测试—采用—长期服务转化路径](assets/figures/landmarks-events-conversion.svg)"
          if "landmarks-events-conversion.svg" not in zh:
              assert zh_ops_anchor in zh
              zh = zh.replace(zh_ops_anchor, zh_ops_anchor + "\n\n" + zh_ops_insert)

          en_ops_anchor = "Long-term operation can include a public C7 walk-through, developer open week, controlled robotics open day, community public-service review and Jing-Zhang technology-history exhibition. Annual reporting should not only announce “what new AI was deployed”; it should also state which ordinary urban capability remains incomplete and which pilots were stopped, rolled back or redesigned."
          en_ops_insert = "![Three public honor nodes, annual event rhythm, and the research—test—adoption—long-term-service conversion pathway](assets/figures/landmarks-events-conversion.en.svg)"
          if "landmarks-events-conversion.en.svg" not in en:
              assert en_ops_anchor in en
              en = en.replace(en_ops_anchor, en_ops_anchor + "\n\n" + en_ops_insert)

          (pkg / "proposal.md").write_text(zh, encoding="utf-8")
          (pkg / "proposal.en.md").write_text(en, encoding="utf-8")

          cm_path = pkg / "compliance_matrix.json"
          cm = json.loads(cm_path.read_text(encoding="utf-8"))
          visual_map = {
              "agent.1": ["三大定位—五大功能—三区两翼协同闭环", "C7品牌与VI概念方向"],
              "agent.2": ["全球AI创新生态案例对照表", "AI全要素生态图谱", "区域协同验证矩阵"],
              "agent.3": ["10张AI+场景卡", "AI场景数据流与隐私治理表"],
              "agent.4": ["公共空间组件库与三层导视系统", "公共荣誉地标+年度活动+转化路径"],
              "agent.5": ["C7品牌与VI概念方向", "公共空间组件库与三层导视系统"],
              "agent.6": ["公共荣誉地标+年度活动+转化路径", "实施与长期运营矩阵", "C7品牌与VI概念方向"],
          }
          note_map = {
              "agent.1": "v0.5 将三大定位、五大功能、三区两翼、区域协同和方案级VI从文字响应升级为可读图件。",
              "agent.2": "v0.5 增加六案例对照表、八要素AI生态图谱和区域协同验证矩阵；不把机构规模、资金或合作写成既定事实。",
              "agent.3": "v0.5 将10个场景展开为完整卡片并增加场景级数据流、隐私、人工复核和退出边界。",
              "agent.4": "v0.5 增加三个公共荣誉节点目录、荣誉展示逻辑、公共空间组件库和三层导视。",
              "agent.5": "v0.5 增加C7符号语法、中英同级传播、京张记忆轨和国际传播五问句法。",
              "agent.6": "v0.5 增加年度活动节奏、开发者社区、场景开放门槛、品牌/IP概念和adopt/revise/stop转化路径。",
          }
          for item in cm.get("requirements", []):
              rid = item.get("requirement_id")
              if rid in visual_map:
                  vals = list(item.get("visual_sections") or [])
                  for v in visual_map[rid]:
                      if v not in vals:
                          vals.append(v)
                  item["visual_sections"] = vals
                  item["coverage_note_zh"] = note_map[rid]
          cm_path.write_text(json.dumps(cm, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          sm_path = pkg / "standard_matrix.json"
          sm = json.loads(sm_path.read_text(encoding="utf-8"))
          for item in sm.get("standards", []):
              if item.get("standard_id") == "PROJECT-AGENT-OPEN-CALL-TASKBOOK":
                  item["evidence_summary_zh"] = (
                      "agent.1-agent.6 已逐项进入 compliance_matrix；v0.5 进一步以任务书协同闭环、"
                      "六案例对照、八要素生态图谱、10场景卡、公共荣誉/组件/导视、长期运营、"
                      "隐私治理和C7品牌VI图件形成可读且双语对应的设计证据。"
                  )
          sm_path.write_text(json.dumps(sm, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          cp_path = pkg / "report/copyright_statement.md"
          cp = cp_path.read_text(encoding="utf-8")
          marker = "## Fonts, icons, code, and toolchain"
          if "case-study-comparison.svg" not in cp:
              block = """### v0.5 additional visual-asset ledger\n\n| Asset group | Paths | Author / generation method | Third-party material embedded | Rights / status |\n| --- | --- | --- | --- | --- |\n| Global case comparison | `assets/figures/case-study-comparison.svg`, `.en.svg` | Original comparison diagram authored from six first-party factual references recorded in `sources.json` | None; no case logo, image, map, video or proprietary diagram is embedded | Submission-original layout; factual-reference-only source use |\n| Public landmarks, events and conversion | `assets/figures/landmarks-events-conversion.svg`, `.en.svg` | Original concept diagram authored from this submission's public-space, scenario and operating logic | None | Submission-original; concept names are not official awards, organizer brands or commitments |\n\n"""
              assert marker in cp
              cp = cp.replace(marker, block + marker)
              cp_path.write_text(cp, encoding="utf-8")

          cl_path = pkg / "changelog.md"
          cl = cl_path.read_text(encoding="utf-8")
          cl = cl.replace(
              "- Pending final packaging work: integrate v0.5 assets into HTML/A3/A0/offline presentation, refresh the manifest through post-finalization tooling, persist a new machine self-check, run participant preflight and validate all visual files before opening a follow-up upstream PR.",
              "- Final packaging is rebuilt by the repository automation pass: bilingual HTML, offline visual, A3/A0, manifest refresh, persisted self-check, preflight and visual integrity checks must all pass before the v0.5 follow-up PR is opened."
          )
          cl_path.write_text(cl, encoding="utf-8")
          PY

      - name: Render bilingual proposal HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_proposal_html.py "$PKG"
          test -s "$PKG/report/proposal.html"
          test -s "$PKG/report/proposal.en.html"

      - name: Build offline visual index and A3/A0 PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import html

          pkg = Path("submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure").resolve()
          fig = pkg / "assets/figures"
          visual = pkg / "visual"
          drawings = pkg / "drawings"
          visual.mkdir(parents=True, exist_ok=True)
          drawings.mkdir(parents=True, exist_ok=True)

          groups = [
              ("Taskbook coordination loop", "taskbook-coordination-loop.svg"),
              ("Global AI case comparison", "case-study-comparison.svg"),
              ("Full-factor AI ecosystem", "ai-ecosystem-map.svg"),
              ("Ten AI scenario cards", "ai-scenario-cards.svg"),
              ("Regional collaboration", "regional-collaboration-matrix.svg"),
              ("Implementation & operations", "implementation-operations-matrix.svg"),
              ("Privacy & data governance", "privacy-data-governance.svg"),
              ("Brand / VI direction", "brand-vi-direction.svg"),
              ("Public-space components & wayfinding", "public-space-components-wayfinding.svg"),
              ("Landmarks, events & conversion", "landmarks-events-conversion.svg"),
              ("Site overview", "site-overview.png"),
              ("Land-use structure", "land-use-structure.png"),
              ("Three key areas", "key-areas.png"),
              ("Mobility & blue-green", "mobility-bluegreen.png"),
              ("Metrics & evidence", "metrics-evidence.png"),
          ]

          zh_titles = {
              "Taskbook coordination loop": "任务书协同闭环",
              "Global AI case comparison": "全球 AI 创新生态案例对照",
              "Full-factor AI ecosystem": "AI 全要素生态图谱",
              "Ten AI scenario cards": "10 张 AI+ 场景卡",
              "Regional collaboration": "区域协同验证矩阵",
              "Implementation & operations": "实施与长期运营矩阵",
              "Privacy & data governance": "数据流与隐私治理",
              "Brand / VI direction": "品牌 / VI 概念方向",
              "Public-space components & wayfinding": "公共空间组件与导视系统",
              "Landmarks, events & conversion": "公共荣誉地标、年度活动与转化路径",
              "Site overview": "总体范围与 C7 方法",
              "Land-use structure": "概念用地结构",
              "Three key areas": "三处重点区域",
              "Mobility & blue-green": "慢行与蓝绿系统",
              "Metrics & evidence": "指标与证据缺口",
          }

          def rel_for_visual(name, lang):
              p = Path(name)
              if lang == "en":
                  candidate = p.with_name(p.stem + ".en" + p.suffix)
                  if (fig / candidate).exists():
                      p = candidate
              return "../assets/figures/" + p.as_posix()

          def visual_html(lang):
              is_en = lang == "en"
              title = "Jing-Zhang City Completeness v0.5" if is_en else "京张城市完整度 v0.5"
              subtitle = ("Complete the city first, then let AI enter daily life." if is_en else "先把城市做完整，再让 AI 进入日常。")
              disclaimer = ("Concept proposal only. Provisional geometry is not an official redline; AI remains optional and basic services keep a non-AI baseline." if is_en else "仅为开放征集阶段概念建议。provisional geometry 不是官方红线；AI 保持可退出，基本城市服务保留非 AI 基线。")
              cards=[]
              for key, name in groups:
                  label = key if is_en else zh_titles[key]
                  src = rel_for_visual(name, lang)
                  cards.append(f'<figure><img src="{html.escape(src)}" alt="{html.escape(label)}"><figcaption>{html.escape(label)}</figcaption></figure>')
              other = "index.html" if is_en else "index.en.html"
              other_label = "阅读中文" if is_en else "English"
              return f'''<!doctype html><html lang="{'en' if is_en else 'zh-CN'}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title}</title><style>
              *{{box-sizing:border-box}} body{{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7fa;color:#172033}} main{{max-width:1500px;margin:auto;padding:34px}} header{{background:white;border-radius:20px;padding:34px;margin-bottom:24px;border:1px solid #d7dee8}} h1{{font-size:42px;margin:0 0 8px}} .sub{{font-size:21px}} .note{{margin-top:18px;color:#667085}} a{{color:#245b8f;font-weight:700}} .grid{{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}} figure{{margin:0;background:white;border:1px solid #d7dee8;border-radius:16px;overflow:hidden}} img{{display:block;width:100%;height:auto;background:white}} figcaption{{padding:12px 16px;font-weight:700;border-top:1px solid #e5eaf0}} @media(max-width:900px){{.grid{{grid-template-columns:1fr}}main{{padding:16px}}h1{{font-size:30px}}}}
              </style></head><body><main><header><h1>{title}</h1><div class="sub">{subtitle}</div><p class="note">{disclaimer}</p><a href="{other}">{other_label}</a></header><section class="grid">{''.join(cards)}</section></main></body></html>'''

          (visual / "index.html").write_text(visual_html("zh"), encoding="utf-8")
          (visual / "index.en.html").write_text(visual_html("en"), encoding="utf-8")

          def uri(name, lang):
              p = Path(name)
              if lang == "en":
                  candidate = p.with_name(p.stem + ".en" + p.suffix)
                  if (fig / candidate).exists(): p = candidate
              return (fig / p).resolve().as_uri()

          a3_pages = [
              [("Taskbook coordination loop","taskbook-coordination-loop.svg")],
              [("Site overview","site-overview.png"),("Land-use structure","land-use-structure.png")],
              [("Three key areas","key-areas.png"),("Mobility & blue-green","mobility-bluegreen.png")],
              [("Global AI case comparison","case-study-comparison.svg")],
              [("Full-factor AI ecosystem","ai-ecosystem-map.svg")],
              [("Ten AI scenario cards","ai-scenario-cards.svg")],
              [("Regional collaboration","regional-collaboration-matrix.svg"),("Privacy & data governance","privacy-data-governance.svg")],
              [("Brand / VI direction","brand-vi-direction.svg"),("Public-space components & wayfinding","public-space-components-wayfinding.svg")],
              [("Implementation & operations","implementation-operations-matrix.svg"),("Landmarks, events & conversion","landmarks-events-conversion.svg")],
              [("Metrics & evidence","metrics-evidence.png")],
          ]
          a0_pages = [
              [("Taskbook coordination loop","taskbook-coordination-loop.svg"),("Site overview","site-overview.png"),("Land-use structure","land-use-structure.png"),("Three key areas","key-areas.png")],
              [("Global AI case comparison","case-study-comparison.svg"),("Full-factor AI ecosystem","ai-ecosystem-map.svg"),("Ten AI scenario cards","ai-scenario-cards.svg"),("Regional collaboration","regional-collaboration-matrix.svg")],
              [("Implementation & operations","implementation-operations-matrix.svg"),("Privacy & data governance","privacy-data-governance.svg"),("Brand / VI direction","brand-vi-direction.svg"),("Public-space components & wayfinding","public-space-components-wayfinding.svg"),("Landmarks, events & conversion","landmarks-events-conversion.svg"),("Metrics & evidence","metrics-evidence.png")],
          ]

          def board_html(lang, size, pages):
              is_en = lang == "en"
              title = "JING-ZHANG CITY COMPLETENESS" if is_en else "京张城市完整度"
              tagline = "Complete the city first, then let AI enter daily life" if is_en else "先把城市做完整，再让 AI 进入日常"
              page_html=[]
              for idx,page in enumerate(pages,1):
                  figs=[]
                  for key,name in page:
                      label = key if is_en else zh_titles[key]
                      figs.append(f'<figure><img src="{uri(name,lang)}"><figcaption>{label}</figcaption></figure>')
                  page_html.append(f'<section class="page"><header><strong>{title}</strong><span>{tagline}</span><em>{idx}/{len(pages)}</em></header><div class="grid g{len(page)}">{"".join(figs)}</div><footer>{"Concept proposal · provisional geometry is not an official redline · AI is opt-out" if is_en else "概念建议 · provisional geometry 不是官方红线 · AI 可退出且保留非 AI 基线"}</footer></section>')
              return f'''<!doctype html><html><head><meta charset="utf-8"><style>@page{{size:{size} landscape;margin:7mm}}*{{box-sizing:border-box}}body{{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#172033}}.page{{height:calc(100vh - 2mm);break-after:page;display:flex;flex-direction:column;gap:4mm;overflow:hidden}}header{{display:flex;align-items:baseline;gap:14mm;border-bottom:1.2mm solid #245b8f;padding-bottom:2mm}}header strong{{font-size:24pt}}header span{{font-size:12pt;flex:1}}header em{{font-style:normal}}.grid{{flex:1;display:grid;gap:4mm;min-height:0}}.g1{{grid-template-columns:1fr}}.g2{{grid-template-columns:1fr 1fr}}.g4{{grid-template-columns:1fr 1fr}}.g6{{grid-template-columns:1fr 1fr 1fr}}figure{{margin:0;border:.3mm solid #cdd6e1;border-radius:3mm;overflow:hidden;display:flex;flex-direction:column;min-height:0}}figure img{{width:100%;height:100%;min-height:0;object-fit:contain;background:#fff}}figcaption{{font-size:9pt;font-weight:700;padding:1.5mm 2mm;border-top:.3mm solid #d7dee8}}footer{{font-size:8pt;color:#667085}}html{{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>{''.join(page_html)}</body></html>'''

          tmp = Path("/tmp/jzv05")
          tmp.mkdir(exist_ok=True)
          for lang in ("zh","en"):
              (tmp / f"a3-{lang}.html").write_text(board_html(lang,"A3",a3_pages),encoding="utf-8")
              (tmp / f"a0-{lang}.html").write_text(board_html(lang,"A0",a0_pages),encoding="utf-8")
          PY

          for lang in zh en; do
            if [ "$lang" = zh ]; then
              A3OUT="$PKG/drawings/a3-booklet.pdf"; A0OUT="$PKG/drawings/a0-boards.pdf"
            else
              A3OUT="$PKG/drawings/a3-booklet.en.pdf"; A0OUT="$PKG/drawings/a0-boards.en.pdf"
            fi
            "$CHROME" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=3000 --no-pdf-header-footer --print-to-pdf="$A3OUT" "file:///tmp/jzv05/a3-$lang.html"
            "$CHROME" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=3000 --no-pdf-header-footer --print-to-pdf="$A0OUT" "file:///tmp/jzv05/a0-$lang.html"
          done
          test -s "$PKG/drawings/a3-booklet.pdf"
          test -s "$PKG/drawings/a3-booklet.en.pdf"
          test -s "$PKG/drawings/a0-boards.pdf"
          test -s "$PKG/drawings/a0-boards.en.pdf"

      - name: Register v0.5 visual assets in manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          pkg=Path("submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure")
          p=pkg/"manifest.json"
          m=json.loads(p.read_text(encoding="utf-8"))
          primary=[
              "taskbook-coordination-loop.svg","case-study-comparison.svg","ai-ecosystem-map.svg","ai-scenario-cards.svg",
              "regional-collaboration-matrix.svg","implementation-operations-matrix.svg","privacy-data-governance.svg",
              "brand-vi-direction.svg","public-space-components-wayfinding.svg","landmarks-events-conversion.svg"
          ]
          existing={x.get("path") for x in m.get("files",[])}
          for name in primary:
              zh=f"assets/figures/{name}"
              en=f"assets/figures/{Path(name).stem}.en.svg"
              if zh not in existing:
                  m["files"].append({"path":zh,"role":"proposal_figure","required":False,"language":"zh"})
                  existing.add(zh)
              if en not in existing:
                  m["files"].append({"path":en,"role":"proposal_figure","required":False,"language":"en","translation_of":zh})
                  existing.add(en)
          if "changelog.md" not in existing:
              m["files"].append({"path":"changelog.md","role":"changelog","required":True})
          m["generated_at"]=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          m.setdefault("validation_claim",{})["self_checked"]=False
          m["validation_claim"]["known_blockers"]=[]
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Refresh manifest and persist strict self-check
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/refresh_submission_manifest.py "$PKG"
          python3 scripts/self_check_submission.py "$PKG" --pr-author miyuuteshima984 --mark-self-checked --json | tee /tmp/self-check.json

      - name: Validate visual and document integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import xml.etree.ElementTree as ET
          import re

          pkg=Path("submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure")
          failures=[]
          for p in sorted((pkg/"assets/figures").glob("*.png")):
              try:
                  with Image.open(p) as im: im.verify()
                  with Image.open(p) as im: im.load()
                  print("PNG PASS",p, p.stat().st_size)
              except Exception as e:
                  failures.append(f"{p}: {e}")
          for p in sorted((pkg/"assets/figures").glob("*.svg")):
              try:
                  ET.parse(p)
                  print("SVG PASS",p,p.stat().st_size)
              except Exception as e:
                  failures.append(f"{p}: {e}")
          for p in [pkg/"drawings/a3-booklet.pdf",pkg/"drawings/a3-booklet.en.pdf",pkg/"drawings/a0-boards.pdf",pkg/"drawings/a0-boards.en.pdf"]:
              if not p.is_file() or p.stat().st_size < 10000: failures.append(f"{p}: missing/small")
          for p in [pkg/"visual/index.html",pkg/"visual/index.en.html",pkg/"report/proposal.html",pkg/"report/proposal.en.html"]:
              text=p.read_text(encoding="utf-8")
              if re.search(r'https?://|//[^/]',text): failures.append(f"{p}: remote URL detected")
          if failures:
              raise SystemExit("\n".join(failures))
          PY
          pdfinfo "$PKG/drawings/a3-booklet.pdf" | head -20
          pdfinfo "$PKG/drawings/a3-booklet.en.pdf" | head -20
          pdfinfo "$PKG/drawings/a0-boards.pdf" | head -20
          pdfinfo "$PKG/drawings/a0-boards.en.pdf" | head -20

