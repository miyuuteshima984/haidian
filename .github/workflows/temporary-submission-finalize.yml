name: temporary-submission-strict-validation

on:
  push:
    branches:
      - automation/jingzhang-finalize

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: temporary-jingzhang-strict-validation
  cancel-in-progress: true

jobs:
  strict-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout finalized formal branch sparsely
        uses: actions/checkout@v4
        with:
          ref: submission/miyuuteshima984/jingzhang-ai-civic-infrastructure
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/
            requirements-review.txt
            tracks.json
            scenarios/
            brief/site-package/
            data/source_registry.json
            submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure/
          persist-credentials: false

      - name: Install current review dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-review.txt
          python3 -m pip install --disable-pip-version-check --quiet 'jsonschema==4.25.1'

      - name: Run strict persisted four-gate self-check
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/self_check_submission.py submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure --pr-author miyuuteshima984 --json > /tmp/selfcheck.json 2> /tmp/selfcheck.stderr
          rc=$?
          cat /tmp/selfcheck.json
          cat /tmp/selfcheck.stderr >&2
          echo "SELFCHECK_RC=$rc" >> "$GITHUB_ENV"
          exit $rc

      - name: Run participant preflight
        if: env.SELFCHECK_RC == '0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/participant_preflight.py submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure --pr-author miyuuteshima984 --check-push --json > /tmp/preflight.json 2> /tmp/preflight.stderr
          rc=$?
          cat /tmp/preflight.json
          cat /tmp/preflight.stderr >&2
          echo "PREFLIGHT_RC=$rc" >> "$GITHUB_ENV"
          exit $rc

      - name: Publish strict validation diagnostics to diagnostic PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          def read(path, limit=45000):
              p=Path(path)
              if not p.exists(): return '(not run)'
              text=p.read_text(encoding='utf-8', errors='replace')
              return text if len(text) <= limit else text[:limit] + '\n... [truncated]'
          body=[]
          body.append('## Strict latest-upstream persisted validation')
          body.append('')
          body.append(f"- self-check rc: `{os.environ.get('SELFCHECK_RC','not-run')}`")
          body.append(f"- preflight rc: `{os.environ.get('PREFLIGHT_RC','not-run')}`")
          body.append('')
          body.append('<details><summary>strict self-check</summary>\n\n```json\n'+read('/tmp/selfcheck.json',32000)+'\n```\n```text\n'+read('/tmp/selfcheck.stderr',5000)+'\n```\n</details>')
          body.append('<details><summary>preflight</summary>\n\n```json\n'+read('/tmp/preflight.json',14000)+'\n```\n```text\n'+read('/tmp/preflight.stderr',5000)+'\n```\n</details>')
          Path('/tmp/pr-comment.md').write_text('\n'.join(body),encoding='utf-8')
          PY
          gh pr comment 3 --repo miyuuteshima984/haidian --body-file /tmp/pr-comment.md

      - name: Fail job if validation failed
        if: always()
        shell: bash
        run: |
          test "${SELFCHECK_RC:-1}" = "0"
          test "${PREFLIGHT_RC:-1}" = "0"
