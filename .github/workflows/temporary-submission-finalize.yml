        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Miyuu Teshima"
          git config user.email "230504675+miyuuteshima984@users.noreply.github.com"
          git add "$PKG"
          git diff --cached --stat
          git commit -m "v0.5: rebuild bilingual review package and persist validation"

