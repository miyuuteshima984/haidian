name: Temporary Jingzhang v0.5 validation diagnostic

on:
  push:
    branches:
      - automation/jingzhang-finalize

permissions:
  contents: read

env:
  TARGET_BRANCH: submission/miyuuteshima984/jingzhang-city-completeness-v05
  PKG: submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout v0.5
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            requirements-review.txt
            scripts
            brief
            data
            docs
            skills
            templates
            scenarios
            tracks
            submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure

      - name: Install validator dependencies
        shell: bash
        run: python3 -m pip install -r requirements-review.txt

      - name: Prepare current proposal HTML and manifest entries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_proposal_html.py "$PKG"
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          pkg=Path("submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure")
          p=pkg/"manifest.json"
          m=json.loads(p.read_text(encoding="utf-8"))
          primary=[
              "taskbook-coordination-loop.svg","case-study-comparison.svg","ai-ecosystem-map.svg","ai-scenario-cards.svg",
              "regional-collaboration-matrix.svg","implementation-operations-matrix.svg","privacy-data-governance.svg",
              "brand-vi-direction.svg","public-space-components-wayfinding.svg","landmarks-events-conversion.svg"
          ]
          existing={x.get("path") for x in m.get("files",[])}
          zero="0"*64
          for name in primary:
              zh=f"assets/figures/{name}"
              en=f"assets/figures/{Path(name).stem}.en.svg"
              if zh not in existing:
                  m["files"].append({"path":zh,"role":"proposal_figure","required":False,"language":"zh","sha256":zero})
                  existing.add(zh)
              if en not in existing:
                  m["files"].append({"path":en,"role":"proposal_figure","required":False,"language":"en","translation_of":zh,"sha256":zero})
                  existing.add(en)
          if "changelog.md" not in existing:
              m["files"].append({"path":"changelog.md","role":"changelog","required":True,"sha256":zero})
          m["generated_at"]=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          m.setdefault("validation_claim",{})["self_checked"]=False
          m["validation_claim"]["known_blockers"]=[]
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Refresh manifest
        shell: bash
        run: python3 scripts/refresh_submission_manifest.py "$PKG"

      - name: Strict self-check concise diagnostic
        shell: bash
        run: |
          set +e
          python3 scripts/self_check_submission.py "$PKG" --pr-author miyuuteshima984 --mark-self-checked --json > /tmp/selfcheck.log 2>&1
          rc=$?
          python3 - <<'PY' > /tmp/concise.log
          import json
          from pathlib import Path
          raw=Path('/tmp/selfcheck.log').read_text(encoding='utf-8',errors='replace')
          try:
              d=json.loads(raw)
          except Exception as e:
              print('JSON_PARSE_ERROR',repr(e)); print(raw[:12000]); raise SystemExit
          print('TOP ok=',d.get('ok'),'can_enter_formal_review=',d.get('can_enter_formal_review'),'review_status=',d.get('review_status'))
          keys={'issues','errors','blockers','next_actions','warnings','blocking_issues','failures'}
          def walk(x,path='root'):
              if isinstance(x,dict):
                  if x.get('ok') is False or x.get('pass') is False or x.get('passed') is False:
                      compact={k:v for k,v in x.items() if k in {'name','id','code','title','ok','pass','passed','status','summary','message','detail','issues','errors','blockers','next_actions','warnings'} and v not in (None,[],{},'')}
                      print('FAILED_NODE',path,json.dumps(compact,ensure_ascii=False)[:5000])
                  for k,v in x.items():
                      if k in keys and v not in (None,[],{},''):
                          print('NONEMPTY',path+'.'+k,json.dumps(v,ensure_ascii=False)[:7000])
                      walk(v,path+'.'+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
          walk(d)
          PY
          cat /tmp/concise.log
          if [ $rc -ne 0 ]; then
            msg="$(head -c 14000 /tmp/concise.log | tr '\n' ' ' | sed 's/%/%25/g;s/\r/%0D/g')"
            echo "::error title=strict_self_check_concise::$msg"
            exit $rc
          fi
