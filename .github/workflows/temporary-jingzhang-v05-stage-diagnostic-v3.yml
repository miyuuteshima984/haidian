name: Temporary Jingzhang v0.5 staged self-check diagnostic v3

on:
  push:
    branches:
      - automation/jingzhang-finalize

permissions:
  contents: read

env:
  TARGET_BRANCH: submission/miyuuteshima984/jingzhang-city-completeness-v05
  PKG: submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Sparse checkout v0.5
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            requirements-review.txt
            scripts
            brief
            data
            docs
            skills
            templates
            scenarios
            tracks
            submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure

      - name: Install validator dependencies
        shell: bash
        run: python3 -m pip install -r requirements-review.txt

      - name: Canonical manifest prep and baseline persisted self-check
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_proposal_html.py "$PKG"
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import json
          pkg=Path('submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure')
          p=pkg/'manifest.json'; m=json.loads(p.read_text(encoding='utf-8')); zero='0'*64
          names=['taskbook-coordination-loop.svg','case-study-comparison.svg','ai-ecosystem-map.svg','ai-scenario-cards.svg','regional-collaboration-matrix.svg','implementation-operations-matrix.svg','privacy-data-governance.svg','brand-vi-direction.svg','public-space-components-wayfinding.svg','landmarks-events-conversion.svg']
          existing={x.get('path') for x in m.get('files',[])}
          for name in names:
              zh=f'assets/figures/{name}'; en=f'assets/figures/{Path(name).stem}.en.svg'
              if zh not in existing: m['files'].append({'path':zh,'role':'proposal_figure','required':False,'language':'zh','sha256':zero}); existing.add(zh)
              if en not in existing: m['files'].append({'path':en,'role':'proposal_figure','required':False,'language':'en','translation_of':zh,'sha256':zero}); existing.add(en)
          if 'changelog.md' not in existing: m['files'].append({'path':'changelog.md','role':'changelog','required':True,'sha256':zero})
          m['generated_at']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          m.setdefault('validation_claim',{})['self_checked']=False
          m['validation_claim']['known_blockers']=[]
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 scripts/refresh_submission_manifest.py "$PKG"
          python3 scripts/self_check_submission.py "$PKG" --pr-author miyuuteshima984 --mark-self-checked --json >/tmp/check-baseline.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/check-baseline.json'))
          print('BASELINE', d.get('ok'), d.get('can_enter_formal_review'), d.get('review_status'))
          if not d.get('ok'): raise SystemExit('canonical-prepped baseline unexpectedly failed')
          PY

      - name: Apply final v0.5 content wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          pkg=Path('submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure')
          zh=(pkg/'proposal.md').read_text(encoding='utf-8')
          en=(pkg/'proposal.en.md').read_text(encoding='utf-8')
          rows=[
            ('这些案例不支撑京张的法定边界、高度或强度，只支撑组织与运营方法。[source:CASE-AISG-100E] [source:CASE-SEOUL-AI-HUB] [source:CASE-PUNGGOL]','![全球 AI 创新生态案例对照：机制—京张转译—不复制边界](assets/figures/case-study-comparison.svg)','case-study-comparison.svg','These cases do not support statutory Jing-Zhang boundaries, heights or development intensity; they support organisational and operating choices only. [source:CASE-AISG-100E] [source:CASE-SEOUL-AI-HUB] [source:CASE-PUNGGOL]','![Global AI innovation ecosystem comparison: mechanism—Jing-Zhang translation—non-copy boundary](assets/figures/case-study-comparison.en.svg)','case-study-comparison.en.svg'),
            ('运营层建议每年进行 C7 城市完整度公开走查、开发者开放周、受控机器人测试开放日、社区公共服务评议和京张技术史展。公开的不应只有“新增了什么 AI”，也应包括“哪项普通城市能力仍有缺口、哪些试点被停止或回退”。','![三个公共荣誉节点、年度活动节奏与研究—测试—采用—长期服务转化路径](assets/figures/landmarks-events-conversion.svg)','landmarks-events-conversion.svg','Long-term operation can include a public C7 walk-through, developer open week, controlled robotics open day, community public-service review and Jing-Zhang technology-history exhibition. Annual reporting should not only announce “what new AI was deployed”; it should also state which ordinary urban capability remains incomplete and which pilots were stopped, rolled back or redesigned.','![Three public honor nodes, annual event rhythm, and the research—test—adoption—long-term-service conversion pathway](assets/figures/landmarks-events-conversion.en.svg)','landmarks-events-conversion.en.svg')]
          for za,zi,zn,ea,ei,en_n in rows:
              if zn not in zh:
                  assert za in zh
                  zh=zh.replace(za,za+'\n\n'+zi)
              if en_n not in en:
                  assert ea in en
                  en=en.replace(ea,ea+'\n\n'+ei)
          (pkg/'proposal.md').write_text(zh,encoding='utf-8')
          (pkg/'proposal.en.md').write_text(en,encoding='utf-8')

          cm_path=pkg/'compliance_matrix.json'; cm=json.loads(cm_path.read_text(encoding='utf-8'))
          visual_map={
            'agent.1':['三大定位—五大功能—三区两翼协同闭环','C7品牌与VI概念方向'],
            'agent.2':['全球AI创新生态案例对照表','AI全要素生态图谱','区域协同验证矩阵'],
            'agent.3':['10张AI+场景卡','AI场景数据流与隐私治理表'],
            'agent.4':['公共空间组件库与三层导视系统','公共荣誉地标+年度活动+转化路径'],
            'agent.5':['C7品牌与VI概念方向','公共空间组件库与三层导视系统'],
            'agent.6':['公共荣誉地标+年度活动+转化路径','实施与长期运营矩阵','C7品牌与VI概念方向']}
          for item in cm.get('requirements',[]):
              rid=item.get('requirement_id')
              if rid in visual_map:
                  vals=list(item.get('visual_sections') or [])
                  for v in visual_map[rid]:
                      if v not in vals: vals.append(v)
                  item['visual_sections']=vals
          cm_path.write_text(json.dumps(cm,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          sm_path=pkg/'standard_matrix.json'; sm=json.loads(sm_path.read_text(encoding='utf-8'))
          for item in sm.get('standards',[]):
              if item.get('standard_id')=='PROJECT-AGENT-OPEN-CALL-TASKBOOK':
                  item['evidence_summary_zh']='agent.1-agent.6 已进入 compliance_matrix；v0.5 进一步形成任务书协同闭环、六案例对照、八要素生态图谱、10场景卡、公共荣誉/组件/导视、长期运营、隐私治理和C7品牌VI的双语可读证据。'
          sm_path.write_text(json.dumps(sm,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          cp_path=pkg/'report/copyright_statement.md'; cp=cp_path.read_text(encoding='utf-8')
          if 'case-study-comparison.svg' not in cp:
              marker='## Fonts, icons, code, and toolchain'
              block='''### v0.5 additional visual-asset ledger\n\n| Asset group | Paths | Author / generation method | Third-party material embedded | Rights / status |\n| --- | --- | --- | --- | --- |\n| Global case comparison | `assets/figures/case-study-comparison.svg`, `.en.svg` | Original comparison diagram from six first-party factual references in `sources.json` | None; no case logo, image, map, video or proprietary diagram embedded | Submission-original layout; factual-reference-only source use |\n| Public landmarks, events and conversion | `assets/figures/landmarks-events-conversion.svg`, `.en.svg` | Original concept diagram from this submission's public-space, scenario and operating logic | None | Submission-original; concept names are not official awards, organizer brands or commitments |\n\n'''
              assert marker in cp
              cp=cp.replace(marker,block+marker)
              cp_path.write_text(cp,encoding='utf-8')
          PY
          python3 scripts/render_proposal_html.py "$PKG"

      - name: Diagnose content-wired persisted self-check
        shell: bash
        run: |
          set +e
          python3 scripts/refresh_submission_manifest.py "$PKG" >/tmp/refresh-wired.log 2>&1
          python3 scripts/self_check_submission.py "$PKG" --pr-author miyuuteshima984 --mark-self-checked --json >/tmp/check-wired.json 2>&1
          rc=$?
          python3 - <<'PY' >/tmp/diag.txt
          import json
          from pathlib import Path
          raw=Path('/tmp/check-wired.json').read_text(encoding='utf-8',errors='replace')
          try: d=json.loads(raw)
          except Exception as e:
              print('JSON_PARSE_ERROR',repr(e)); print(raw[:12000]); raise SystemExit
          print('WIRED ok=',d.get('ok'),'can_enter_formal_review=',d.get('can_enter_formal_review'),'review_status=',d.get('review_status'))
          for k in ('next_actions','blockers','errors','issues','warnings'):
              v=d.get(k)
              if v: print(k,json.dumps(v,ensure_ascii=False)[:12000])
          def walk(x,path='root'):
              if isinstance(x,dict):
                  if x.get('ok') is False or x.get('pass') is False or x.get('passed') is False:
                      keep={k:v for k,v in x.items() if k in ('name','id','code','title','ok','pass','passed','status','summary','message','detail','issues','errors','blockers','next_actions','warnings') and v not in (None,[],{},'')}
                      print('FAILED',path,json.dumps(keep,ensure_ascii=False)[:10000])
                  for k,v in x.items(): walk(v,path+'.'+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
          walk(d)
          PY
          cat /tmp/diag.txt
          msg="$(head -c 18000 /tmp/diag.txt | tr '\n' ' ' | sed 's/%/%25/g;s/\r/%0D/g')"
          if [ $rc -ne 0 ]; then
            echo "::error title=v05_content_wiring_self_check::$msg"
            exit $rc
          else
            echo "::notice title=v05_content_wiring_self_check::$msg"
          fi
