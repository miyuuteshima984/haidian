name: temporary-jingzhang-visual-repair

on:
  push:
    branches:
      - automation/jingzhang-finalize

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: temporary-jingzhang-visual-repair
  cancel-in-progress: true

jobs:
  repair-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout formal submission and canonical tooling
        uses: actions/checkout@v4
        with:
          ref: submission/miyuuteshima984/jingzhang-ai-civic-infrastructure
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/
            requirements-review.txt
            tracks.json
            scenarios/
            brief/site-package/
            data/source_registry.json
            submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure/
          persist-credentials: true

      - name: Install visual and review dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check -r requirements-review.txt
          python3 -m pip install --disable-pip-version-check --quiet matplotlib pillow jsonschema==4.25.1

      - name: Regenerate bilingual core figures and drawings
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math, textwrap
          from pathlib import Path
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          from matplotlib.patches import Polygon as MplPolygon, Patch
          from matplotlib.lines import Line2D
          from matplotlib.backends.backend_pdf import PdfPages
          from PIL import Image
          from pyproj import Transformer

          PKG = Path('submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure')
          FIG = PKG/'assets'/'figures'
          DRAW = PKG/'drawings'
          FIG.mkdir(parents=True, exist_ok=True)
          DRAW.mkdir(parents=True, exist_ok=True)

          plt.rcParams['font.sans-serif'] = ['Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans']
          plt.rcParams['axes.unicode_minus'] = False
          plt.rcParams['savefig.facecolor'] = 'white'
          T = Transformer.from_crs('EPSG:4326','EPSG:4548',always_xy=True)

          def fc(path):
              return json.loads((PKG/path).read_text(encoding='utf-8'))

          layers = {
              'site': fc('geometry/site_boundary.geojson'),
              'keys': fc('geometry/key_areas.geojson'),
              'land': fc('geometry/land_use.geojson'),
              'roads': fc('geometry/roads.geojson'),
              'green': fc('geometry/green_space.geojson'),
              'public': fc('geometry/public_space.geojson'),
          }
          metrics = json.loads((PKG/'metrics.json').read_text(encoding='utf-8'))['metrics']

          def xy(pt):
              return T.transform(float(pt[0]), float(pt[1]))

          def draw_geom(ax, geom, face='none', edge='black', lw=1.2, alpha=1.0, z=2, label=None):
              typ = geom.get('type')
              c = geom.get('coordinates', [])
              if typ == 'Polygon':
                  if c:
                      pts=[xy(p) for p in c[0]]
                      ax.add_patch(MplPolygon(pts, closed=True, facecolor=face, edgecolor=edge, linewidth=lw, alpha=alpha, zorder=z, label=label))
              elif typ == 'MultiPolygon':
                  for poly in c:
                      if poly:
                          pts=[xy(p) for p in poly[0]]
                          ax.add_patch(MplPolygon(pts, closed=True, facecolor=face, edgecolor=edge, linewidth=lw, alpha=alpha, zorder=z))
              elif typ == 'LineString':
                  if c:
                      pts=[xy(p) for p in c]
                      ax.plot([p[0] for p in pts],[p[1] for p in pts],color=edge,linewidth=lw,alpha=alpha,zorder=z,label=label)
              elif typ == 'MultiLineString':
                  for line in c:
                      pts=[xy(p) for p in line]
                      ax.plot([p[0] for p in pts],[p[1] for p in pts],color=edge,linewidth=lw,alpha=alpha,zorder=z)
              elif typ == 'Point':
                  x,y=xy(c); ax.scatter([x],[y],s=55,c=edge,alpha=alpha,zorder=z,label=label)
              elif typ == 'MultiPoint':
                  pts=[xy(p) for p in c]; ax.scatter([p[0] for p in pts],[p[1] for p in pts],s=45,c=edge,alpha=alpha,zorder=z)

          def centroid(geom):
              typ=geom.get('type'); c=geom.get('coordinates',[])
              pts=[]
              if typ=='Polygon' and c: pts=c[0]
              elif typ=='MultiPolygon' and c and c[0]: pts=c[0][0]
              elif typ=='LineString': pts=c
              elif typ=='Point': return xy(c)
              if not pts: return (0,0)
              proj=[xy(p) for p in pts]
              return (sum(p[0] for p in proj)/len(proj), sum(p[1] for p in proj)/len(proj))

          def site_extent(ax, pad=.06):
              pts=[]
              for f in layers['site']['features']:
                  g=f['geometry']
                  if g['type']=='Polygon': pts += [xy(p) for p in g['coordinates'][0]]
              xs=[p[0] for p in pts]; ys=[p[1] for p in pts]
              dx=max(xs)-min(xs); dy=max(ys)-min(ys)
              ax.set_xlim(min(xs)-dx*pad,max(xs)+dx*pad)
              ax.set_ylim(min(ys)-dy*pad,max(ys)+dy*pad)
              ax.set_aspect('equal', adjustable='box')
              ax.axis('off')

          def style_map(ax):
              ax.set_facecolor('#f7f6f2')
              for f in layers['site']['features']:
                  draw_geom(ax,f['geometry'],face='#f0eee8',edge='#4b5563',lw=2.2,alpha=.85,z=1)

          land_colors={'0701':'#d9a0a0','0702':'#efc48c','0802':'#8eb7d6','0803':'#b6a0d7','0804':'#e4d36f','05':'#d6a2c8','1401':'#9bc98e'}
          land_names_zh={'0701':'住宅','0702':'社区服务','0802':'科研','0803':'文化','0804':'教育','05':'商业服务','1401':'公园绿地'}
          land_names_en={'0701':'Residential','0702':'Community service','0802':'Research','0803':'Culture','0804':'Education','05':'Commercial service','1401':'Park green'}

          key_short_zh=['众智园创新校园','AI 原点长期社区','大钟寺站城生活区']
          key_short_en=['Zhongzhiyuan innovation campus','AI Origin long-term community','Dazhongsi station-city district']
          key_tasks_zh=[
              '研发 + 受控测试 + 公共交流 + 普通日常服务',
              '长期居住 + 托育/照护 + 共享工作 + 公共客厅',
              '换乘 + 商业 + 文化 + 普通城市生活（边界待核）']
          key_tasks_en=[
              'R&D + controlled testing + civic exchange + daily services',
              'Long-term housing + care + shared work + civic living room',
              'Transfer + commerce + culture + ordinary urban life (boundary pending)']

          def title_block(fig, title, subtitle, lang):
              fig.text(.055,.965,title,fontsize=25,fontweight='bold',va='top')
              fig.text(.055,.925,subtitle,fontsize=11,va='top',color='#4b5563')
              warn = ('概念建议 · provisional geometry 非官方红线 · official data 到位后整体复算' if lang=='zh'
                      else 'Concept proposal · provisional geometry is not an official redline · recalculate when official data arrives')
              fig.text(.055,.025,warn,fontsize=9,color='#7c2d12')

          def save_site(lang, out):
              fig=plt.figure(figsize=(16,10))
              ax=fig.add_axes([.055,.10,.64,.78]); side=fig.add_axes([.73,.12,.23,.72]); side.axis('off')
              title_block(fig, '01｜总体范围与城市完整度' if lang=='zh' else '01 | Site Overview + City Completeness',
                          '一脊、六段、六缝、三核｜C7 = HOME / LEARN / CARE / MOVE / GREEN / WORK / COMMON LIFE' if lang=='zh' else 'One civic green spine · six completeness segments · six east-west stitches · three key-area cores', lang)
              style_map(ax)
              for f in layers['green']['features']: draw_geom(ax,f['geometry'],face='#a7d49b',edge='#5b8d53',lw=1,alpha=.55,z=2)
              for f in layers['roads']['features']: draw_geom(ax,f['geometry'],edge='#557a95',lw=1.5,alpha=.8,z=3)
              for i,f in enumerate(layers['keys']['features']):
                  draw_geom(ax,f['geometry'],face='none',edge='#b45309',lw=2.8,alpha=1,z=5)
                  x,y=centroid(f['geometry']); ax.text(x,y,str(i+1),ha='center',va='center',fontsize=13,fontweight='bold',color='#7c2d12',zorder=6)
              site_extent(ax)
              side.text(0,1,'三层工作框架' if lang=='zh' else 'Three-scale work frame',fontsize=16,fontweight='bold',va='top')
              rows=(['统筹研究约 43.6 km²｜产业、人才、未来城市机制','总体设计约 11.4 km²｜连续空间、用地、慢行、绿地','三处重点区约 368.4 ha｜逐项详细设计任务'] if lang=='zh'
                    else ['Coordinated research ~43.6 km² | ecosystem + talent + future city','Overall design ~11.4 km² | continuous spatial structure','Three key areas ~368.4 ha | detailed design tasks'])
              y=.90
              for r in rows:
                  side.text(0,y,'• '+r,fontsize=11,va='top',wrap=True); y-=.13
              side.text(0,y,'C7',fontsize=18,fontweight='bold'); y-=.07
              side.text(0,y,'HOME · LEARN · CARE · MOVE · GREEN · WORK · COMMON LIFE',fontsize=10.5,wrap=True); y-=.14
              side.text(0,y,('AI 是跨七项能力的可选增强层，不是“第八项用地”。' if lang=='zh' else 'AI is an optional enhancement across C7, not an eighth land-use category.'),fontsize=11,wrap=True)
              fig.savefig(out,dpi=120,bbox_inches='tight'); plt.close(fig)

          def save_land(lang,out):
              fig=plt.figure(figsize=(16,10)); ax=fig.add_axes([.055,.11,.70,.76]); side=fig.add_axes([.78,.13,.19,.70]); side.axis('off')
              title_block(fig,'02｜C7 用地 + 公共底盘结构' if lang=='zh' else '02 | C7 Land-use + Civic Base Structure',
                          '13 个概念用地 feature；合法分类子集；AI 不创造新法定用地类别' if lang=='zh' else '13 conceptual land-use features; allowed codes only; AI does not create a new statutory land-use class',lang)
              style_map(ax)
              for f in layers['land']['features']:
                  p=f.get('properties',{}); code=str(p.get('land_use_code',''))
                  col=land_colors.get(code,'#c7c7c7'); draw_geom(ax,f['geometry'],face=col,edge='white',lw=1.2,alpha=.88,z=3)
                  x,y=centroid(f['geometry']); ax.text(x,y,p.get('id',f.get('id','')),fontsize=6.5,ha='center',va='center',color='#263238')
              for f in layers['roads']['features']: draw_geom(ax,f['geometry'],edge='#4b6475',lw=1.1,alpha=.65,z=5)
              site_extent(ax)
              side.text(0,1,'图例' if lang=='zh' else 'Legend',fontsize=16,fontweight='bold',va='top'); y=.91
              names=land_names_zh if lang=='zh' else land_names_en
              for code,col in land_colors.items():
                  side.add_patch(plt.Rectangle((0,y-.018),.08,.03,color=col,transform=side.transAxes,clip_on=False)); side.text(.12,y,names[code]+'  '+code,fontsize=10.5,va='center'); y-=.075
              side.text(0,y-.02,('设计纪律' if lang=='zh' else 'Design discipline'),fontsize=14,fontweight='bold'); y-=.10
              notes=(['概念面积 ≠ 法定控规','conceptual_floors ≠ 批准高度','六段是工作片区，不是行政社区'] if lang=='zh' else ['Concept area ≠ statutory zoning','conceptual_floors ≠ approved height','Six segments are work zones, not administrative communities'])
              for n in notes: side.text(0,y,'• '+n,fontsize=10.5,wrap=True); y-=.08
              fig.savefig(out,dpi=120,bbox_inches='tight'); plt.close(fig)

          def save_keys(lang,out):
              fig=plt.figure(figsize=(16,10)); ax=fig.add_axes([.055,.13,.58,.72]); side=fig.add_axes([.67,.12,.30,.75]); side.axis('off')
              title_block(fig,'03｜三处重点区域：C7 缺口与补齐任务' if lang=='zh' else '03 | Three Key Areas: C7 Gaps + Completion Tasks',
                          '差异来自功能缺口，而不是三个视觉主题' if lang=='zh' else 'Differentiation comes from functional gaps, not three visual themes',lang)
              style_map(ax)
              colors=['#7aa6c2','#c88e9f','#b69a62']
              for i,f in enumerate(layers['keys']['features']):
                  draw_geom(ax,f['geometry'],face=colors[i],edge='#7c2d12',lw=2.4,alpha=.35,z=4)
                  x,y=centroid(f['geometry']); ax.text(x,y,str(i+1),fontsize=16,fontweight='bold',ha='center',va='center',color='#7c2d12')
              site_extent(ax)
              names=key_short_zh if lang=='zh' else key_short_en; tasks=key_tasks_zh if lang=='zh' else key_tasks_en
              side.text(0,1,'重点区任务' if lang=='zh' else 'Key-area tasks',fontsize=16,fontweight='bold',va='top'); y=.91
              for i,(n,t) in enumerate(zip(names,tasks)):
                  area=layers['keys']['features'][i]['properties'].get('official_area_sqm',0)/10000
                  side.text(0,y,f'{i+1}. {n}',fontsize=12.5,fontweight='bold',va='top'); y-=.05
                  side.text(.03,y,(f'公告约 {area:.1f} ha｜' if lang=='zh' else f'Announced ~{area:.1f} ha | ')+t,fontsize=10.2,va='top',wrap=True); y-=.15
              side.text(0,y,('共同底线：公共空间先承担真实日常功能；测试可关闭、可审计；普通通道不成为默认试验场。' if lang=='zh' else 'Shared baseline: public space serves ordinary life first; tests are closable and auditable; ordinary routes are not default test beds.'),fontsize=10.5,wrap=True,color='#374151')
              fig.savefig(out,dpi=120,bbox_inches='tight'); plt.close(fig)

          def save_mob(lang,out):
              fig=plt.figure(figsize=(16,10)); ax=fig.add_axes([.055,.11,.70,.76]); side=fig.add_axes([.79,.13,.18,.70]); side.axis('off')
              title_block(fig,'04｜慢行 · 蓝绿 · 公共空间' if lang=='zh' else '04 | Mobility · Blue-Green · Civic Space',
                          '公共绿脊首先是步行、骑行、无障碍、遮阴、雨洪与免费停留基础设施' if lang=='zh' else 'The civic green spine first serves walking, cycling, accessibility, shade, stormwater and free staying',lang)
              style_map(ax)
              for f in layers['green']['features']: draw_geom(ax,f['geometry'],face='#8fc48a',edge='#4f8550',lw=1.2,alpha=.65,z=2)
              for f in layers['public']['features']: draw_geom(ax,f['geometry'],face='#e8b96f',edge='#9a5b13',lw=1.2,alpha=.75,z=4)
              for f in layers['roads']['features']:
                  p=f.get('properties',{}); edge='#486e8b' if str(p.get('id','')).startswith('ROAD-') else '#6b7280'
                  draw_geom(ax,f['geometry'],edge=edge,lw=2 if str(p.get('id','')) in {'ROAD-001','ROAD-002'} else 1.4,alpha=.9,z=5)
              site_extent(ax)
              side.text(0,1,'公共优先规则' if lang=='zh' else 'Public-first rules',fontsize=16,fontweight='bold',va='top'); y=.91
              notes=(['无账号 / 无 App 仍可进入','AI 导览只是可选增强','六条东西联系是连接意图，不是道路红线','轨道出入口、桥隧、停车待专业资料核定'] if lang=='zh' else ['No account / no app required','AI guidance is optional','Six E-W links are intentions, not road redlines','Transit exits, structures and parking await professional data'])
              for n in notes: side.text(0,y,'• '+n,fontsize=10.5,va='top',wrap=True); y-=.11
              handles=[Patch(facecolor='#8fc48a',edgecolor='#4f8550',label='绿地 / Green'),Patch(facecolor='#e8b96f',edgecolor='#9a5b13',label='公共空间 / Civic space'),Line2D([0],[0],color='#486e8b',lw=2,label='慢行联系 / Slow mobility')]
              side.legend(handles=handles,loc='lower left',frameon=False,fontsize=9)
              fig.savefig(out,dpi=120,bbox_inches='tight'); plt.close(fig)

          def mv(key):
              x=metrics[key]
              return x.get('value') if isinstance(x,dict) else x

          def save_metrics(lang,out):
              fig=plt.figure(figsize=(16,10)); title_block(fig,'05｜指标 · 证据 · 数据缺口' if lang=='zh' else '05 | Metrics · Evidence · Data Gaps',
                          '已知值、概念设计量、unknown 法定/工程量严格分开' if lang=='zh' else 'Known values, conceptual design quantities and unknown statutory/engineering quantities are kept separate',lang)
              ax1=fig.add_axes([.055,.57,.90,.28]); ax1.axis('off')
              cards=[('SITE',f"{mv('site_area_sqm')/1e6:.2f} km²"),('GREEN',f"{mv('green_ratio')*100:.1f}%"),('PUBLIC',f"{mv('public_space_ratio')*100:.1f}%"),('C7',str(int(mv('city_completeness_dimension_count')))),('AI+',str(int(mv('ai_scenario_count')))),('KEY AREAS',str(int(mv('key_area_count'))))]
              for i,(k,v) in enumerate(cards):
                  x=i/6+.008
                  ax1.add_patch(plt.Rectangle((x,.15),.145,.68,facecolor='#f3f4f6',edgecolor='#d1d5db',transform=ax1.transAxes))
                  ax1.text(x+.072,.62,k,ha='center',va='center',fontsize=10,color='#4b5563',transform=ax1.transAxes)
                  ax1.text(x+.072,.38,v,ha='center',va='center',fontsize=22,fontweight='bold',transform=ax1.transAxes)
              ax2=fig.add_axes([.07,.16,.43,.34])
              vals=[mv('land_use_residential_sqm'),mv('land_use_community_service_sqm'),mv('land_use_research_sqm'),mv('land_use_cultural_sqm'),mv('land_use_education_sqm'),mv('land_use_commercial_service_sqm'),mv('land_use_park_green_sqm')]
              labs=list((land_names_zh if lang=='zh' else land_names_en).values())
              ax2.barh(labs,[v/1e6 for v in vals]); ax2.set_xlabel('百万 m²' if lang=='zh' else 'million m²'); ax2.set_title('概念用地量（非已批控规）' if lang=='zh' else 'Concept land-use quantities (not approved zoning)',fontsize=12)
              ax2.grid(axis='x',alpha=.2)
              ax3=fig.add_axes([.56,.16,.39,.34]); ax3.axis('off')
              ax3.text(0,1,'关键数据缺口' if lang=='zh' else 'Critical data gaps',fontsize=15,fontweight='bold',va='top')
              gaps=(['官方总体与三重点区精确 polygon','正式 FAR / 高度 / 道路红线 / 文保 / 消防 / 市政','逐栋现状、权属、人口家庭与公共服务容量','正式道路宽度、停车、轨道接口与工程条件'] if lang=='zh' else ['Official precise site + three key-area polygons','Official FAR / height / road redlines / heritage / fire / utilities','Cleared building, tenure, household and service-capacity survey','Verified road widths, parking, transit interfaces and engineering constraints'])
              y=.86
              for g in gaps: ax3.text(0,y,'• '+g,fontsize=10.5,va='top',wrap=True); y-=.14
              ax3.text(0,.25,('复算触发：official geometry 或关键控制到位 → 用地、建筑、道路、绿地、公共空间、分期、指标、图纸与 HTML 全包重算。' if lang=='zh' else 'Recalculation trigger: when official geometry or key controls arrive, recompute land use, buildings, roads, green/civic space, phasing, metrics, drawings and HTML.'),fontsize=10.5,wrap=True,color='#7c2d12')
              fig.savefig(out,dpi=120,bbox_inches='tight'); plt.close(fig)

          generators=[('site-overview',save_site),('land-use-structure',save_land),('key-areas',save_keys),('mobility-bluegreen',save_mob),('metrics-evidence',save_metrics)]
          for stem,fn in generators:
              fn('zh',FIG/f'{stem}.png')
              fn('en',FIG/f'{stem}.en.png')

          # Verify every generated PNG before touching drawings.
          for p in sorted(FIG.glob('*.png')):
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  im.load()
              data=p.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', p
              assert data.endswith(b'IEND\xaeB`\x82'), p
              print('PNG PASS',p.name,len(data))

          # A3 bilingual booklets: five readable figure pages.
          for lang,suffix in [('zh',''),('en','.en')]:
              pdf=DRAW/f'a3-booklet{suffix}.pdf'
              with PdfPages(pdf) as pp:
                  for idx,(stem,_) in enumerate(generators,1):
                      fig=plt.figure(figsize=(16.5,11.7))
                      ax=fig.add_axes([.03,.05,.94,.90]); ax.axis('off')
                      img=plt.imread(FIG/f'{stem}{suffix}.png')
                      ax.imshow(img); ax.set_aspect('auto')
                      pp.savefig(fig,bbox_inches='tight'); plt.close(fig)

          # A0 bilingual boards: one landscape board with all five figures.
          for lang,suffix in [('zh',''),('en','.en')]:
              fig=plt.figure(figsize=(46.8,33.1))
              fig.suptitle('京张城市完整度 / JING-ZHANG CITY COMPLETENESS' if lang=='zh' else 'JING-ZHANG CITY COMPLETENESS',fontsize=38,fontweight='bold',y=.985)
              positions=[(0.03,0.52,0.45,0.42),(0.52,0.52,0.45,0.42),(0.03,0.05,0.29,0.40),(0.355,0.05,0.29,0.40),(0.68,0.05,0.29,0.40)]
              for (stem,_),pos in zip(generators,positions):
                  ax=fig.add_axes(pos); ax.axis('off'); ax.imshow(plt.imread(FIG/f'{stem}{suffix}.png')); ax.set_aspect('auto')
              fig.text(.03,.012,'概念建议 · provisional geometry 非官方红线' if lang=='zh' else 'Concept proposal · provisional geometry is not an official redline',fontsize=18,color='#7c2d12')
              fig.savefig(DRAW/f'a0-boards{suffix}.pdf',format='pdf',bbox_inches='tight'); plt.close(fig)

          print('Visual regeneration complete')
          PY

      - name: Re-render report HTML
        shell: bash
        run: |
          python3 scripts/render_proposal_html.py submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure

      - name: Finalize and persist canonical self-check
        shell: bash
        run: |
          python3 scripts/finalize_submission.py submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure
          python3 scripts/self_check_submission.py submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure --pr-author miyuuteshima984 --mark-self-checked --json | tee /tmp/selfcheck.json
          python3 scripts/participant_preflight.py submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure --pr-author miyuuteshima984 --check-push --json | tee /tmp/preflight.json

      - name: Final PNG decode proof
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/png-proof.txt
          from pathlib import Path
          from PIL import Image
          import hashlib
