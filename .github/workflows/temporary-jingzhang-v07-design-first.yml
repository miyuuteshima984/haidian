name: Temporary Jingzhang v0.7 design-first integrator

on:
  push:
    branches:
      - automation/jingzhang-finalize
    paths:
      - .github/workflows/temporary-jingzhang-v07-design-first.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.7 branch
        uses: actions/checkout@v4
        with:
          ref: submission/miyuuteshima984/jingzhang-city-completeness-v07
          fetch-depth: 0

      - name: Add design-first v0.7 spatial narratives
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure')
          figures = root / 'assets/figures'
          figures.mkdir(parents=True, exist_ok=True)

          zh_journeys = r'''<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
          <title id="title">京张城市完整度 v0.7 三条日常城市链</title><desc id="desc">用三条从普通日常出发的空间旅程说明众智园、AI原点和大钟寺的物理空间补齐、可选AI增强与失败退出路径。</desc>
          <style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.h1{font-size:44px;font-weight:700}.sub{font-size:18px;fill:#5f6b79}.h2{font-size:26px;font-weight:700}.b{font-size:17px}.s{font-size:14px;fill:#64748b}.label{font-size:14px;font-weight:700}.panel{fill:#fff;stroke:#d7dee8;stroke-width:2}.ground{fill:#e7ebef}.green{fill:#d8f1df}.blue{fill:#dcecff}.warm{fill:#fde8d0}.human{fill:#172033}.ai{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:10 8}.route{fill:none;stroke:#0f766e;stroke-width:8;stroke-linecap:round}.exit{fill:none;stroke:#b91c1c;stroke-width:4;stroke-dasharray:7 7}.thin{stroke:#94a3b8;stroke-width:2}</style>
          <rect width="1600" height="1000" fill="#f7f9fc"/><text x="60" y="68" class="h1">v0.7｜三条日常城市链：先看人怎么过一天，再看 AI 放在哪里</text><text x="60" y="104" class="sub">黑色=人和普通城市功能 · 绿色=物理空间补齐 · 蓝色虚线=可选 AI 增强 · 红色虚线=失败/退出后仍可走的路径</text>
          <g transform="translate(55,145)"><rect width="1490" height="235" rx="18" class="panel"/><text x="25" y="42" class="h2">01 众智园｜研究者 + 配送/服务劳动者：从到达、工作、吃饭休息到受控测试</text>
            <rect x="25" y="70" width="1440" height="120" rx="14" class="ground"/><rect x="150" y="92" width="220" height="75" rx="8" class="blue"/><rect x="510" y="100" width="200" height="67" rx="8" class="green"/><rect x="850" y="95" width="220" height="72" rx="8" class="warm"/><rect x="1195" y="92" width="210" height="75" rx="8" class="blue"/>
            <path d="M70 150 C230 150 350 150 520 150 S900 150 1030 150 S1260 150 1425 150" class="route"/>
            <circle cx="95" cy="137" r="12" class="human"/><rect x="88" y="149" width="14" height="28" rx="5" class="human"/><circle cx="430" cy="137" r="12" class="human"/><rect x="423" y="149" width="14" height="28" rx="5" class="human"/><circle cx="790" cy="137" r="12" class="human"/><rect x="783" y="149" width="14" height="28" rx="5" class="human"/>
            <path d="M1195 120 C1260 75 1360 75 1410 120" class="ai"/><path d="M1190 172 C1260 205 1360 205 1430 170" class="exit"/>
            <text x="155" y="116" class="label">共享研发 / 工作</text><text x="518" y="126" class="label">吃饭 + 休息 + 公共交流</text><text x="858" y="120" class="label">普通步行始终畅通</text><text x="1205" y="116" class="label">封闭/可控测试院</text><text x="25" y="218" class="s">空间变化不是多一块屏幕：测试口袋与普通通行物理分离；有等候/休息/人工监护位置；设备退出后仍是完整创新校园。</text>
          </g>
          <g transform="translate(55,405)"><rect width="1490" height="235" rx="18" class="panel"/><text x="25" y="42" class="h2">02 AI 原点｜老人 + 照护者 + 无手机使用者：从家门、休息、照护到公共客厅</text>
            <rect x="25" y="70" width="1440" height="120" rx="14" class="ground"/><rect x="120" y="93" width="230" height="74" rx="8" class="warm"/><rect x="470" y="100" width="190" height="67" rx="8" class="green"/><rect x="800" y="92" width="220" height="75" rx="8" class="blue"/><rect x="1170" y="92" width="235" height="75" rx="8" class="green"/>
            <path d="M70 150 C240 150 365 150 510 150 S800 150 910 150 S1220 150 1425 150" class="route"/>
            <circle cx="90" cy="136" r="12" class="human"/><rect x="83" y="148" width="14" height="28" rx="5" class="human"/><circle cx="440" cy="136" r="12" class="human"/><rect x="433" y="148" width="14" height="28" rx="5" class="human"/><circle cx="745" cy="136" r="12" class="human"/><rect x="738" y="148" width="14" height="28" rx="5" class="human"/>
            <path d="M795 120 C860 72 950 72 1025 120" class="ai"/><path d="M790 176 C860 207 955 207 1035 174" class="exit"/>
            <text x="130" y="118" class="label">长期住房 / 家庭入口</text><text x="480" y="126" class="label">遮阴 + 坐凳 + 实体导视</text><text x="810" y="118" class="label">照护 / 人工服务点</text><text x="1180" y="118" class="label">公共客厅 + 普通商业</text><text x="25" y="218" class="s">AI 导航只叠加在已成立的物理无障碍和人工求助网络上；拒绝账号、追踪或个性化后，路线和服务不降级。</text>
          </g>
          <g transform="translate(55,665)"><rect width="1490" height="235" rx="18" class="panel"/><text x="25" y="42" class="h2">03 大钟寺｜通勤者 + 国际访客 + 服务劳动者：从到达、换乘、吃饭到遗产公共界面</text>
            <rect x="25" y="70" width="1440" height="120" rx="14" class="ground"/><rect x="110" y="93" width="220" height="74" rx="8" class="blue"/><rect x="470" y="95" width="210" height="72" rx="8" class="green"/><rect x="820" y="92" width="220" height="75" rx="8" class="warm"/><rect x="1180" y="92" width="230" height="75" rx="8" class="green"/>
            <path d="M70 150 C240 150 360 150 520 150 S800 150 930 150 S1230 150 1425 150" class="route"/>
            <circle cx="90" cy="136" r="12" class="human"/><rect x="83" y="148" width="14" height="28" rx="5" class="human"/><circle cx="410" cy="136" r="12" class="human"/><rect x="403" y="148" width="14" height="28" rx="5" class="human"/><circle cx="760" cy="136" r="12" class="human"/><rect x="753" y="148" width="14" height="28" rx="5" class="human"/>
            <path d="M105 120 C170 72 260 72 335 120" class="ai"/><path d="M100 176 C175 207 265 207 345 174" class="exit"/>
            <text x="120" y="118" class="label">固定中英导视 / 到达门</text><text x="480" y="120" class="label">人工问询 + 无障碍换乘</text><text x="830" y="118" class="label">普通商业 / 等候 / 休息</text><text x="1190" y="118" class="label">京张遗产 + 公共绿脊</text><text x="25" y="218" class="s">动态信息和多语 AI 可以增强可读性，但基础导视和人工服务必须单独成立；错误建议时可立即回到实体路径和人工更新。</text>
          </g>
          <text x="60" y="965" class="s">Concept-only · 不是现状测绘或工程定位。provisional geometry 只承担概念设计；真实站口、道路、许可、保险与责任主体需另行核验。</text></svg>'''

          en_journeys = zh_journeys.replace('京张城市完整度 v0.7 三条日常城市链','Jing-Zhang City Completeness v0.7 Three Everyday Journeys').replace('用三条从普通日常出发的空间旅程说明众智园、AI原点和大钟寺的物理空间补齐、可选AI增强与失败退出路径。','Three spatial journeys show physical urban repair, optional AI enhancement, and a functioning exit state in Zhongzhiyuan, AI Origin and Dazhongsi.').replace('v0.7｜三条日常城市链：先看人怎么过一天，再看 AI 放在哪里','v0.7 | Three everyday journeys: start with a day in the city, then place AI').replace('黑色=人和普通城市功能 · 绿色=物理空间补齐 · 蓝色虚线=可选 AI 增强 · 红色虚线=失败/退出后仍可走的路径','Black = people and ordinary city functions · Green = physical repair · Blue dash = optional AI · Red dash = functioning route after failure/exit').replace('01 众智园｜研究者 + 配送/服务劳动者：从到达、工作、吃饭休息到受控测试','01 Zhongzhiyuan | researcher + delivery/service worker: arrival, work, rest, controlled testing').replace('共享研发 / 工作','Shared R&D / work').replace('吃饭 + 休息 + 公共交流','Food + rest + public exchange').replace('普通步行始终畅通','Ordinary walking remains open').replace('封闭/可控测试院','Bounded controllable test yard').replace('空间变化不是多一块屏幕：测试口袋与普通通行物理分离；有等候/休息/人工监护位置；设备退出后仍是完整创新校园。','Urban change is not another screen: test pockets are physically separated from ordinary circulation, with waiting/rest and staffed supervision; the campus still works after devices exit.').replace('02 AI 原点｜老人 + 照护者 + 无手机使用者：从家门、休息、照护到公共客厅','02 AI Origin | older resident + carer + no-phone user: home, rest, care, civic commons').replace('长期住房 / 家庭入口','Long-term housing / home entry').replace('遮阴 + 坐凳 + 实体导视','Shade + seating + physical signs').replace('照护 / 人工服务点','Care / staffed service point').replace('公共客厅 + 普通商业','Civic commons + ordinary retail').replace('AI 导航只叠加在已成立的物理无障碍和人工求助网络上；拒绝账号、追踪或个性化后，路线和服务不降级。','AI navigation only layers onto physical accessibility and staffed help; refusing an account, tracking or personalization never degrades the route or basic service.').replace('03 大钟寺｜通勤者 + 国际访客 + 服务劳动者：从到达、换乘、吃饭到遗产公共界面','03 Dazhongsi | commuter + international visitor + service worker: arrival, interchange, food, heritage commons').replace('固定中英导视 / 到达门','Fixed bilingual signs / arrival gate').replace('人工问询 + 无障碍换乘','Staffed help + accessible interchange').replace('普通商业 / 等候 / 休息','Ordinary retail / waiting / rest').replace('京张遗产 + 公共绿脊','Jing-Zhang heritage + civic green spine').replace('动态信息和多语 AI 可以增强可读性，但基础导视和人工服务必须单独成立；错误建议时可立即回到实体路径和人工更新。','Dynamic information and multilingual AI may enhance legibility, but static signs and staffed service stand alone; bad advice falls back immediately to physical routes and human updates.').replace('Concept-only · 不是现状测绘或工程定位。provisional geometry 只承担概念设计；真实站口、道路、许可、保险与责任主体需另行核验。','Concept-only · Not a survey or engineering alignment. Provisional geometry supports concept design only; real entrances, roads, permits, insurance and accountable parties require verification.')

          zh_form = r'''<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">v0.7 AI 如何改变城市形态</title><desc id="desc">六类空间原型说明AI能力如何转译为可逆的城市形态变化，而不是只增加数字界面。</desc><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.h1{font-size:44px;font-weight:700}.sub{font-size:18px;fill:#5f6b79}.h2{font-size:23px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#64748b}.card{fill:#fff;stroke:#d8e0ea;stroke-width:2}.base{fill:#e9edf1}.physical{fill:#d9f1df}.digital{fill:#dcecff}.line{stroke:#0f766e;stroke-width:6}.dash{stroke:#2563eb;stroke-width:4;stroke-dasharray:9 8;fill:none}.red{stroke:#b91c1c;stroke-width:4;stroke-dasharray:7 7;fill:none}</style><rect width="1600" height="1000" fill="#f7f9fc"/><text x="60" y="68" class="h1">v0.7｜AI 改变城市形态：把能力转成可逆的物理接口</text><text x="60" y="104" class="sub">每个原型先有 ordinary city baseline，再增加空间条件，最后才叠加 AI；AI 退出时物理空间仍完整。</text>
          <g transform="translate(55,150)"><rect width="470" height="310" rx="18" class="card"/><text x="22" y="40" class="h2">A｜测试口袋，而不是公共路当试验场</text><rect x="25" y="70" width="420" height="105" rx="12" class="base"/><path d="M45 125 H425" class="line"/><rect x="265" y="88" width="145" height="68" rx="10" class="digital"/><path d="M280 110 H390" class="dash"/><text x="25" y="215" class="b">物理变化：普通通行 / 测试边界 / 等候与人工监护分开。</text><text x="25" y="247" class="s">AI 层：设备状态、越界告警；不获得公共通行优先权。</text><text x="25" y="279" class="s">退出：撤设备后恢复为普通院落/公共空间。</text></g>
          <g transform="translate(565,150)"><rect width="470" height="310" rx="18" class="card"/><text x="22" y="40" class="h2">B｜社区门槛成为可求助的无障碍节点</text><rect x="25" y="70" width="420" height="105" rx="12" class="base"/><rect x="55" y="92" width="120" height="62" rx="8" class="physical"/><rect x="250" y="92" width="150" height="62" rx="8" class="digital"/><path d="M175 125 H250" class="line"/><text x="25" y="215" class="b">物理变化：坐凳、遮阴、实体导视、人工服务台、连续无障碍。</text><text x="25" y="247" class="s">AI 层：可选导航/翻译；不要求账号才能获得基本服务。</text><text x="25" y="279" class="s">退出：静态导视 + 人工服务继续。</text></g>
          <g transform="translate(1075,150)"><rect width="470" height="310" rx="18" class="card"/><text x="22" y="40" class="h2">C｜站城到达从“找入口”变成连续公共界面</text><rect x="25" y="70" width="420" height="105" rx="12" class="base"/><rect x="45" y="92" width="90" height="62" rx="8" class="digital"/><rect x="170" y="92" width="110" height="62" rx="8" class="physical"/><rect x="315" y="92" width="105" height="62" rx="8" class="physical"/><path d="M135 125 H170 M280 125 H315" class="line"/><text x="25" y="215" class="b">物理变化：固定中英导视、人工问询、休息和普通商业串成到达链。</text><text x="25" y="247" class="s">AI 层：动态换乘/多语信息，必须可由现场人员纠错。</text><text x="25" y="279" class="s">退出：基础站城可读性不消失。</text></g>
          <g transform="translate(55,500)"><rect width="470" height="310" rx="18" class="card"/><text x="22" y="40" class="h2">D｜新基础设施做成可替换的小节点</text><rect x="25" y="70" width="420" height="105" rx="12" class="base"/><rect x="70" y="92" width="105" height="62" rx="8" class="physical"/><rect x="215" y="92" width="105" height="62" rx="8" class="digital"/><path d="M320 125 H405" class="red"/><text x="25" y="215" class="b">物理变化：端侧算力、充电、维护落在可拆换服务节点，不形成永久巨构。</text><text x="25" y="247" class="s">AI 层：设备共享与状态管理；真实容量服从市政/消防核验。</text><text x="25" y="279" class="s">退出：节点可移除，普通公共功能不受损。</text></g>
          <g transform="translate(565,500)"><rect width="470" height="310" rx="18" class="card"/><text x="22" y="40" class="h2">E｜公共首层优先留给人，而不是设备</text><rect x="25" y="70" width="420" height="105" rx="12" class="base"/><rect x="55" y="92" width="210" height="62" rx="8" class="physical"/><rect x="300" y="92" width="105" height="62" rx="8" class="digital"/><text x="25" y="215" class="b">物理变化：可坐、可停、可吃饭、可会面、可人工服务的首层公共界面。</text><text x="25" y="247" class="s">AI 层：预约/翻译/信息增强；设备不挤占无障碍和自由停留空间。</text><text x="25" y="279" class="s">退出：公共生活仍成立。</text></g>
          <g transform="translate(1075,500)"><rect width="470" height="310" rx="18" class="card"/><text x="22" y="40" class="h2">F｜规划方法从一次定稿变成可回退的原型链</text><circle cx="80" cy="120" r="25" class="physical"/><circle cx="190" cy="120" r="25" class="digital"/><circle cx="300" cy="120" r="25" class="physical"/><circle cx="410" cy="120" r="25" class="physical"/><path d="M105 120 H165 M215 120 H275 M325 120 H385" class="line"/><path d="M300 155 C300 205 190 205 190 155" class="red"/><text x="55" y="130" class="s">看</text><text x="176" y="130" class="s">试</text><text x="286" y="130" class="s">评</text><text x="395" y="130" class="s">并</text><text x="25" y="215" class="b">空间版本：观察 → 小范围原型 → 公共/专业复核 → 合并或回退。</text><text x="25" y="247" class="s">AI 可辅助生成/监测，但不能自证正确或替代最终人类判断。</text><text x="25" y="279" class="s">退出：回到上一可用城市状态，而不是留下失效设施。</text></g>
          <text x="60" y="870" class="sub">共同原则：AI 不是第八类用地，而是让测试、服务、到达、基础设施与规划过程需要新的“可开 / 可停 / 可替换”空间接口。</text><text x="60" y="925" class="s">Concept-only · 所有空间尺寸、设备容量与工程接口需在 official geometry、现状调查和专业条件到位后深化。</text></svg>'''
          en_form = zh_form.replace('v0.7 AI 如何改变城市形态','v0.7 How AI Changes Urban Form').replace('六类空间原型说明AI能力如何转译为可逆的城市形态变化，而不是只增加数字界面。','Six spatial prototypes translate AI capabilities into reversible urban-form changes rather than simply adding digital interfaces.').replace('v0.7｜AI 改变城市形态：把能力转成可逆的物理接口','v0.7 | How AI changes urban form: reversible physical interfaces').replace('每个原型先有 ordinary city baseline，再增加空间条件，最后才叠加 AI；AI 退出时物理空间仍完整。','Each prototype starts with an ordinary-city baseline, adds physical conditions, then optional AI; the city still works after AI exits.').replace('A｜测试口袋，而不是公共路当试验场','A | Test pockets, not public routes as test tracks').replace('物理变化：普通通行 / 测试边界 / 等候与人工监护分开。','Physical change: ordinary circulation, test boundary, waiting and staffed supervision are separated.').replace('AI 层：设备状态、越界告警；不获得公共通行优先权。','AI layer: device status and boundary alerts; no priority over public circulation.').replace('退出：撤设备后恢复为普通院落/公共空间。','Exit: remove devices and retain an ordinary yard/public space.').replace('B｜社区门槛成为可求助的无障碍节点','B | Neighborhood thresholds become accessible help nodes').replace('物理变化：坐凳、遮阴、实体导视、人工服务台、连续无障碍。','Physical change: seating, shade, static signs, staffed help and continuous accessibility.').replace('AI 层：可选导航/翻译；不要求账号才能获得基本服务。','AI layer: optional navigation/translation; no account required for basic service.').replace('退出：静态导视 + 人工服务继续。','Exit: static signs and staffed service continue.').replace('C｜站城到达从“找入口”变成连续公共界面','C | Station-city arrival becomes a continuous public interface').replace('物理变化：固定中英导视、人工问询、休息和普通商业串成到达链。','Physical change: fixed bilingual signs, staffed help, rest and ordinary retail form one arrival chain.').replace('AI 层：动态换乘/多语信息，必须可由现场人员纠错。','AI layer: dynamic transfer/multilingual information, correctable by on-site staff.').replace('退出：基础站城可读性不消失。','Exit: basic station-city legibility remains.').replace('D｜新基础设施做成可替换的小节点','D | New infrastructure becomes replaceable small nodes').replace('物理变化：端侧算力、充电、维护落在可拆换服务节点，不形成永久巨构。','Physical change: edge compute, charging and maintenance sit in removable service nodes, not permanent megastructures.').replace('AI 层：设备共享与状态管理；真实容量服从市政/消防核验。','AI layer: shared-device and status management; real capacity follows utility/fire verification.').replace('退出：节点可移除，普通公共功能不受损。','Exit: nodes can be removed without damaging ordinary public functions.').replace('E｜公共首层优先留给人，而不是设备','E | Public ground floors prioritize people, not equipment').replace('物理变化：可坐、可停、可吃饭、可会面、可人工服务的首层公共界面。','Physical change: ground-floor interfaces for sitting, staying, food, meeting and staffed service.').replace('AI 层：预约/翻译/信息增强；设备不挤占无障碍和自由停留空间。','AI layer: booking/translation/information enhancement; devices never consume accessibility or free-stay space.').replace('退出：公共生活仍成立。','Exit: public life still works.').replace('F｜规划方法从一次定稿变成可回退的原型链','F | Planning becomes a reversible prototype chain').replace('空间版本：观察 → 小范围原型 → 公共/专业复核 → 合并或回退。','Spatial versioning: observe → bounded prototype → public/professional review → merge or rollback.').replace('AI 可辅助生成/监测，但不能自证正确或替代最终人类判断。','AI may assist generation/monitoring but cannot self-certify or replace final human judgment.').replace('退出：回到上一可用城市状态，而不是留下失效设施。','Exit: return to the previous functioning city state rather than leave failed infrastructure.').replace('共同原则：AI 不是第八类用地，而是让测试、服务、到达、基础设施与规划过程需要新的“可开 / 可停 / 可替换”空间接口。','Shared principle: AI is not an eighth land-use category; it creates a need for spatial interfaces that can start, stop and be replaced across testing, service, arrival, infrastructure and planning.').replace('Concept-only · 所有空间尺寸、设备容量与工程接口需在 official geometry、现状调查和专业条件到位后深化。','Concept-only · All dimensions, device capacity and engineering interfaces require later verification against official geometry, site surveys and professional conditions.')

          (figures/'everyday-journey-sections.svg').write_text(zh_journeys, encoding='utf-8')
          (figures/'everyday-journey-sections.en.svg').write_text(en_journeys, encoding='utf-8')
          (figures/'ai-urban-form-change.svg').write_text(zh_form, encoding='utf-8')
          (figures/'ai-urban-form-change.en.svg').write_text(en_form, encoding='utf-8')

          p = root/'proposal.md'
          text = p.read_text(encoding='utf-8').replace('iteration: "v0.6"','iteration: "v0.7"')
          anchor = '场景治理遵守同一底线：不用 App 仍能通行与获得基本服务；不参加测试不会失去社区权益；高风险判断转人工；设备或模型退出后，基本城市功能仍在。这既是技术鲁棒性，也是公共空间的公平性要求。\n\n'
          block = '''### v0.7 三条日常城市链：把协议重新变成空间\n\nv0.7 不再把“评审索引”当作第一视觉，而从三类真实日常路径重新组织重点区：**众智园的研究者与服务劳动者**从到达、研发、吃饭休息走到受控测试；**AI 原点的老人、照护者与无手机使用者**从家门、休息、照护走到公共客厅；**大钟寺的通勤者、国际访客与服务劳动者**从到达、换乘、普通商业走到京张遗产公共界面。每条路径都先要求物理空间完整，再允许 AI 作为可关闭的增强层。\n\n![三条日常城市链：普通城市基线—空间补齐—可选 AI—退出后仍可用](assets/figures/everyday-journey-sections.svg)\n\n### AI 如何改变城市形态，而不是只增加屏幕\n\nAI 对城市形态的影响被压缩为六类可逆空间原型：①把具身智能测试装进与普通通行物理分离的**测试口袋**；②把社区入口做成有坐凳、遮阴、实体导视和人工服务的**无障碍求助节点**；③把站城入口、固定中英导视、人工问询、普通商业和休息串成**连续到达界面**；④把端侧算力、充电、维护做成可拆换的**小型服务节点**而非永久巨构；⑤公共首层优先留给可坐、可停、可吃饭、可会面和人工服务的人；⑥规划方法采用“观察—小范围原型—公共/专业复核—合并或回退”的**可回退空间版本链**。这回答的是 AI 如何改变空间组织和规划方法，而不是如何给既有空间附加更多数字界面。\n\n![AI 如何改变城市形态：六类可逆物理接口](assets/figures/ai-urban-form-change.svg)\n\n'''
          if '### v0.7 三条日常城市链' not in text:
              text = text.replace(anchor, anchor + block)
          old = '''v0.6 不把新增证据继续藏在附件末端，而新增“评审证据总表”和“评审证据索引”：前者把核心指标、三个旗舰试点、9 类人群、实施证据门和主张边界推到离线 visual 首屏；后者把七项公开 rubric 与 agent.1–agent.6 一跳映射到 proposal、图件、JSON、GeoJSON 和权利/来源证据。两者都不是自评分，也不把机器 gate PASS 解释为现场或法定有效性。\n\n![v0.6 评审证据总表](assets/figures/review-evidence-dashboard.svg)\n\n![七维 rubric 与 agent.1–agent.6 评审证据索引](assets/figures/reviewer-evidence-index.svg)\n\n'''
          text = text.replace(old, 'v0.7 将 v0.6 的 reviewer evidence dashboard / index 降为后部追溯附件，不再作为设计叙事或首屏主视觉；评分、gate 与设计内容继续分离。\n\n')
          p.write_text(text, encoding='utf-8')

          p = root/'proposal.en.md'
          text = p.read_text(encoding='utf-8').replace('iteration: "v0.6"','iteration: "v0.7"')
          anchor = 'All scenarios share a governance floor: basic circulation and services work without an app; non-participation does not remove community rights; high-risk decisions escalate to humans; and basic urban functions survive when a model, device, account or platform is withdrawn. This is both technological robustness and public-space equity.\n\n'
          block = '''### v0.7 Three Everyday Journeys: Turn Protocols Back into Space\n\nv0.7 no longer treats a reviewer index as the first visual. The three key areas are reorganized around everyday journeys: **a researcher and service worker in Zhongzhiyuan** move from arrival to R&D, food/rest and a bounded test yard; **an older resident, carer and no-phone user in AI Origin** move from home to rest, care and civic commons; **a commuter, international visitor and service worker in Dazhongsi** move from arrival and interchange through ordinary retail to the Jing-Zhang heritage public interface. Each journey requires a complete physical city first; AI is only a switchable enhancement layer.\n\n![Three everyday journeys: ordinary-city baseline—physical repair—optional AI—functioning exit state](assets/figures/everyday-journey-sections.en.svg)\n\n### How AI Changes Urban Form, Not Just Screens\n\nThe spatial effect of AI is reduced to six reversible prototypes: (1) put embodied-AI trials in **test pockets** physically separated from ordinary circulation; (2) turn neighborhood thresholds into **accessible help nodes** with seating, shade, static signs and staffed service; (3) connect station arrival, fixed bilingual wayfinding, staffed help, ordinary retail and rest into a **continuous arrival interface**; (4) place edge compute, charging and maintenance in **replaceable small service nodes** rather than permanent megastructures; (5) reserve public ground floors for sitting, staying, food, meeting and staffed help before equipment; and (6) use a **reversible spatial version chain**—observe, bounded prototype, public/professional review, merge or rollback. This answers how AI changes spatial organization and planning method rather than merely attaching more digital interfaces to existing space.\n\n![How AI changes urban form: six reversible physical interfaces](assets/figures/ai-urban-form-change.en.svg)\n\n'''
          if '### v0.7 Three Everyday Journeys' not in text:
              text = text.replace(anchor, anchor + block)
          old = '''v0.6 stops hiding new evidence at the end of supplemental files. A **review evidence dashboard** moves core metrics, three flagship pilots, nine user groups, implementation gates and claim boundaries into the first viewport of the offline visual; a **reviewer evidence index** maps all seven public rubric dimensions and agent.1–agent.6 directly to proposal, figure, JSON, GeoJSON and rights/source evidence. Neither is a self-score, and neither turns a machine gate PASS into field or statutory validity.\n\n![v0.6 review evidence dashboard](assets/figures/review-evidence-dashboard.en.svg)\n\n![Seven-dimension rubric and agent.1–agent.6 reviewer evidence index](assets/figures/reviewer-evidence-index.en.svg)\n\n'''
          text = text.replace(old, 'v0.7 demotes the v0.6 reviewer evidence dashboard/index to a back-of-package traceability appendix. It is no longer part of the design narrative or first-screen visual; scoring, gates and design content remain separate.\n\n')
          p.write_text(text, encoding='utf-8')

          for name, lang in [('visual/index.html','zh'),('visual/index.en.html','en')]:
