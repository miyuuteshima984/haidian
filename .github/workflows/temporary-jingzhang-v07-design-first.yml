                  text = re.sub(r'<section class="sheet" id="v06-review-evidence">.*?</section>\n', new, text, count=1, flags=re.S)
                  text = text.replace('<tr><td>Review traceability</td><td>Seven public rubric dimensions + agent.1–agent.6 reviewer evidence index</td></tr>','<tr><td>Spatial experience prototypes</td><td>Three everyday journeys + six AI urban-form interfaces; audit index moved to back-of-package traceability</td></tr>')
              p.write_text(text, encoding='utf-8')

          c = root/'changelog.md'
          text = c.read_text(encoding='utf-8')
          if '## v0.7 - 2026-08-13' not in text:
              entry = '''## v0.7 - 2026-08-13\n\n- Reversed the v0.6 rubric-first presentation after the merged #2143 Review Agent score fell from 83 to 76 despite all four gates passing: the above-fold reviewer dashboard is demoted to traceability, while the first visual now communicates actual urban experience.\n- Added bilingual **three everyday journey sections** for Zhongzhiyuan, AI Origin and Dazhongsi, combining ordinary-city baseline, physical-space repair, optional AI enhancement and a functioning failure/exit route.\n- Added bilingual **AI changes urban form** prototypes: bounded test pockets, accessible help thresholds, continuous station-city arrival interfaces, replaceable service nodes, people-first public ground floors and reversible spatial versioning.\n- Updated both proposals and offline visual first screens to foreground spatial design rather than scoring mechanics. Audit/index assets remain available as back-of-package traceability only.\n- Started from upstream main `0f051ddb5b91bf5e1992a1b32b8c3b2763978fc8`, which includes the latest design-depth schema and validator changes.\n\n'''
              text = text.replace('# 方案迭代记录\n\n', '# 方案迭代记录\n\n' + entry, 1)
          c.write_text(text, encoding='utf-8')

