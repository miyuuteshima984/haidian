name: temporary-jingzhang-visual-repair-v2

on:
  push:
    branches:
      - automation/jingzhang-finalize

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: temporary-jingzhang-visual-repair-v2
  cancel-in-progress: true

jobs:
  repair-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout automation workflow source
        uses: actions/checkout@v4
        with:
          ref: automation/jingzhang-finalize
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/temporary-visual-repair.yml
          persist-credentials: false

      - name: Extract proven visual generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/temporary-visual-repair.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(src) if "python3 - <<'PY'" in l)+1
          end=next(i for i in range(start,len(src)) if src[i].strip()=='PY')
          block=src[start:end]
          indents=[len(l)-len(l.lstrip()) for l in block if l.strip()]
          n=min(indents)
          Path('/tmp/regenerate_visuals.py').write_text('\n'.join(l[n:] for l in block)+'\n',encoding='utf-8')
          print('extracted',len(block),'lines')
          PY

      - name: Checkout formal submission and canonical tooling
        uses: actions/checkout@v4
        with:
          ref: submission/miyuuteshima984/jingzhang-ai-civic-infrastructure
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/
            requirements-review.txt
            tracks.json
            scenarios/
            brief/site-package/
            data/source_registry.json
            submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure/
          persist-credentials: true

      - name: Install visual and review dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check -r requirements-review.txt
          python3 -m pip install --disable-pip-version-check --quiet matplotlib pillow jsonschema==4.25.1

      - name: Regenerate bilingual core figures and drawings
        shell: bash
        run: python3 /tmp/regenerate_visuals.py

      - name: Re-render report HTML
        shell: bash
        run: python3 scripts/render_proposal_html.py submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure

      - name: Refresh review-ready manifest hashes
        shell: bash
        run: |
          python3 scripts/refresh_submission_manifest.py submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure --json | tee /tmp/refresh.json

      - name: Persist canonical self-check
        shell: bash
        run: |
          python3 scripts/self_check_submission.py submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure --pr-author miyuuteshima984 --mark-self-checked --json | tee /tmp/selfcheck.json

      - name: Participant preflight
        shell: bash
        run: |
          python3 scripts/participant_preflight.py submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure --pr-author miyuuteshima984 --check-push --json | tee /tmp/preflight.json

      - name: Final PNG decode proof
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/png-proof.txt
          from pathlib import Path
          from PIL import Image
          import hashlib
          root=Path('submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure/assets/figures')
          files=sorted(root.glob('*.png'))
          assert len(files)==10, len(files)
          for p in files:
              data=p.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', p
              assert data.endswith(b'IEND\xaeB`\x82'), p
              with Image.open(p) as im:
                  dims=f'{im.width}x{im.height}'
                  im.verify()
              with Image.open(p) as im:
                  im.load()
              print(f'{p.name} | PASS | {dims} | bytes={len(data)} | sha256={hashlib.sha256(data).hexdigest()}')
          PY

      - name: Commit repaired package to formal branch
        shell: bash
        run: |
          git config user.name 'miyuuteshima984'
          git config user.email '230504675+miyuuteshima984@users.noreply.github.com'
          git add submissions/miyuuteshima984/jingzhang-ai-civic-infrastructure
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Repair bilingual visual package and refresh validation'
          git push origin HEAD:refs/heads/submission/miyuuteshima984/jingzhang-ai-civic-infrastructure

      - name: Post repair diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Visual repair v2 run'
            echo
            for f in refresh selfcheck preflight; do
              echo "### $f"
              echo '```json'
              tail -c 12000 "/tmp/$f.json" 2>/dev/null || true
              echo
              echo '```'
            done
            echo '### PNG decode proof'
            echo '```text'
            cat /tmp/png-proof.txt 2>/dev/null || true
            echo '```'
          } > /tmp/repair-comment.md
          gh pr comment 3 --repo miyuuteshima984/haidian --body-file /tmp/repair-comment.md
