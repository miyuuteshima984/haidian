<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif}.t{font-weight:700;fill:#111827}.s{fill:#64748b}.h{font-weight:700;fill:#0f766e}.b{fill:#334155}</style><text x="60" y="72" font-size="42" class="t">v0.91｜现实资料必须回到公共任务</text><text x="60" y="112" font-size="20" class="s">现实约束 → 普通人的任务 → 空间响应 → 可选 AI / 退出</text><rect x="60.0" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="60.0" y="170" width="477.3333333333333" height="14" rx="7" fill="#0f766e"/><text x="88.0" y="232" font-size="27" class="t">到达不是一条蓝线</text><circle cx="96.0" cy="281" r="8" fill="#0f766e"/><text x="118.0" y="288" font-size="19" class="h">现实</text><text x="118.0" y="319" font-size="16" class="b">下穿条件 → 竖向连续性待解</text><circle cx="96.0" cy="373" r="8" fill="#0f766e"/><text x="118.0" y="380" font-size="19" class="h">空间</text><text x="118.0" y="411" font-size="16" class="b">实体导视 + 人工帮助先成立</text><circle cx="96.0" cy="465" r="8" fill="#0f766e"/><text x="118.0" y="472" font-size="19" class="h">AI</text><text x="118.0" y="503" font-size="16" class="b">仅可选路径辅助；失效可退出</text><rect x="561.3333333333333" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="561.3333333333333" y="170" width="477.3333333333333" height="14" rx="7" fill="#2563eb"/><text x="589.3333333333333" y="232" font-size="27" class="t">绿廊首先是公共空间</text><circle cx="597.3333333333333" cy="281" r="8" fill="#2563eb"/><text x="619.3333333333333" y="288" font-size="19" class="h">现实</text><text x="619.3333333333333" y="319" font-size="16" class="b">更新界面需与京张绿廊衔接</text><circle cx="597.3333333333333" cy="373" r="8" fill="#2563eb"/><text x="619.3333333333333" y="380" font-size="19" class="h">空间</text><text x="619.3333333333333" y="411" font-size="16" class="b">连续步行 + 停留 + 公共首层优先</text><circle cx="597.3333333333333" cy="465" r="8" fill="#2563eb"/><text x="619.3333333333333" y="472" font-size="19" class="h">AI/物流</text><text x="619.3333333333333" y="503" font-size="16" class="b">退到不切断公共通行的位置</text><rect x="1062.6666666666665" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="1062.6666666666665" y="170" width="477.3333333333333" height="14" rx="7" fill="#b45309"/><text x="1090.6666666666665" y="232" font-size="27" class="t">强度参照不是控制值</text><circle cx="1098.6666666666665" cy="281" r="8" fill="#b45309"/><text x="1120.6666666666665" y="288" font-size="19" class="h">现实</text><text x="1120.6666666666665" y="319" font-size="16" class="b">7 个地块只给量级标尺</text><circle cx="1098.6666666666665" cy="373" r="8" fill="#b45309"/><text x="1120.6666666666665" y="380" font-size="19" class="h">空间</text><text x="1120.6666666666665" y="411" font-size="16" class="b">概念容量服从普通城市完整度</text><circle cx="1098.6666666666665" cy="465" r="8" fill="#b45309"/><text x="1120.6666666666665" y="472" font-size="19" class="h">边界</text><text x="1120.6666666666665" y="503" font-size="16" class="b">approved FAR/height 继续 unknown</text><text x="60" y="848" font-size="16" class="s">设计合同，不是现场绩效；不新增官方红线、工程线位、批准强度或机构承诺。</text></svg>